<html><body style='margin:0;width:320px;height:272px;background:#000;overflow:hidden;touch-action:none;user-select:none'><div style='position:relative;width:320px;height:200px'><canvas id='c' width='320' height='200' style='display:block;width:320px;height:200px;image-rendering:pixelated;background:#000'></canvas><div id='menu' style='position:absolute;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-family:monospace;z-index:10'><div style='font:bold 44px Impact,Arial Black;text-shadow:3px 3px #500'>DOOM</div><div id='msg' style='font-size:9px;color:#c44;margin:5px 0 15px'>KNEE-DEEP IN THE DEAD</div><button id='start' type='button' style='width:120px;height:32px;background:#760000;color:#fff;border:1px solid #aaa;font:bold 11px monospace'>START</button></div></div><div style='position:relative;width:320px;height:72px;background:#171717;border-top:2px solid #555;color:#ddd;font:10px monospace'><div id='state' style='position:absolute;left:5px;top:3px;color:#aaa'>DOOM // READY</div><div id='health' style='position:absolute;left:5px;top:19px;color:#e33'>HEALTH 100</div><div id='ammo' style='position:absolute;left:95px;top:19px;color:#e5c75b'>AMMO 50</div><div id='kills' style='position:absolute;left:185px;top:19px;color:#aaa'>KILLS 0</div><button id='left' type='button' style='position:absolute;left:4px;bottom:4px;width:38px;height:29px;background:#292929;border:1px solid #777;color:#fff'>◀</button><button id='forward' type='button' style='position:absolute;left:46px;bottom:4px;width:38px;height:29px;background:#292929;border:1px solid #777;color:#fff'>▲</button><button id='right' type='button' style='position:absolute;left:88px;bottom:4px;width:38px;height:29px;background:#292929;border:1px solid #777;color:#fff'>▶</button><button id='back' type='button' style='position:absolute;left:130px;bottom:4px;width:38px;height:29px;background:#292929;border:1px solid #777;color:#fff'>▼</button><button id='fire' type='button' style='position:absolute;right:4px;bottom:3px;width:82px;height:31px;background:#760000;border:1px solid #aaa;color:#fff;font:bold 11px monospace'>FIRE</button></div><script>(()=>{const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false}),menu=document.getElementById('menu'),start=document.getElementById('start'),msg=document.getElementById('msg'),health=document.getElementById('health'),ammo=document.getElementById('ammo'),kills=document.getElementById('kills'),stateEl=document.getElementById('state'),W=320,H=200,PI=Math.PI,FOV=PI/3,TAU=PI*2,zb=new Float32Array(W),keys={l:0,r:0,f:0,b:0,fire:0},enemies=[];let running=0,px=2.5,py=1.5,dir=0,hp=100,bullets=50,score=0,shot=0,muzzle=0,recoil=0,hitFlash=0,last=0;const MAP=['111111111111111111111111','100000000000000000000001','101111111011111111111101','101000001010000000000101','101011101010111111110101','101010001010000000010101','101010111110101111010101','101010000000101001010101','101011111111101101010101','100000000000001101000001','101111111111111101111101','101000000000000001000101','101011111011111111010101','101010001010000000010101','101010101011111111110101','101010101000000000000101','101011101111111111111101','101000000000000000000001','101111111111111111111101','111111111111111111111111'];function clamp(v,a,b){return v<a?a:v>b?b:v}function ang(a){while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a}function wall(x,y){x=Math.floor(x);y=Math.floor(y);return x<0||y<0||x>=24||y>=20||MAP[y].charAt(x)==='1'}function free(x,y){return !wall(x,y)}function see(x1,y1,x2,y2){let dx=x2-x1,dy=y2-y1,n=Math.ceil(Math.hypot(dx,dy)*12);for(let i=1;i<n;i++){let q=i/n;if(wall(x1+dx*q,y1+dy*q))return false}return true}function move(dx,dy){let nx=px+dx,ny=py+dy;if(free(nx,py))px=nx;if(free(px,ny))py=ny}function ray(a){let dx=Math.cos(a),dy=Math.sin(a),mx=Math.floor(px),my=Math.floor(py),sx=dx<0?-1:1,sy=dy<0?-1:1,ddx=dx===0?1e30:Math.abs(1/dx),ddy=dy===0?1e30:Math.abs(1/dy),sdx=dx<0?(px-mx)*ddx:(mx+1-px)*ddx,sdy=dy<0?(py-my)*ddy:(my+1-py)*ddy,side=0,d=30;for(let i=0;i<80;i++){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}if(wall(mx,my)){d=side?sdy-ddy:sdx-ddx;break}}return[d,side]}function background(){g.fillStyle='#26394d';g.fillRect(0,0,W,100);g.fillStyle='#334c62';g.fillRect(0,0,W,50);g.fillStyle='#2b4358';g.fillRect(0,50,W,50);g.fillStyle='#33261d';g.fillRect(0,100,W,100);for(let y=104;y<200;y+=8){g.fillStyle=(y/8|0)%2?'#30231b':'#36271e';g.fillRect(0,y,W,4)}}function renderWalls(){for(let s=0;s<W;s++){let a=dir-FOV/2+(s+.5)/W*FOV,r=ray(a),d=r[0]*Math.cos(a-dir);d=Math.max(.05,d);zb[s]=d;let h=Math.min(220,112/d),top=(100-h/2)|0,bot=(100+h/2)|0,side=r[1];for(let y=Math.max(0,top);y<Math.min(H,bot);y++){let v=(y-top)/Math.max(1,h),brick=((Math.floor(v*12)+Math.floor(s/8))&1);let light=clamp(1-d*.045,.22,1)*(side?.72:1),rr=(brick?142:118)*light|0,gg=(brick?48:38)*light|0,bb=(brick?28:24)*light|0;g.fillStyle='rgb('+rr+','+gg+','+bb+')';g.fillRect(s,y,1,1)}}}function sprite(e){if(!e.alive)return;let dx=e.x-px,dy=e.y-py,d=Math.hypot(dx,dy);if(d<.2||d>30||!see(px,py,e.x,e.y))return;let a=ang(Math.atan2(dy,dx)-dir);if(Math.abs(a)>FOV*.75)return;let sx=160+Math.tan(a)/Math.tan(FOV/2)*160,scale=75/d,w=Math.max(4,32*scale),h=Math.max(8,48*scale),l=sx-w/2,t=100-h*.65,r=l+w,b=t+h;for(let i=Math.max(0,l|0);i<Math.min(W,r|0);i++){if(zb[i]<d)continue;let u=(i-l)/w;for(let j=Math.max(0,t|0);j<Math.min(H,b|0);j++){let v=(j-t)/h,q=(u-.5)*(u-.5)/.22+(v-.45)*(v-.45)/.46;if(q<1){let col=v<.28?'#b98b61':v<.58?'#7d2117':'#3c0b09';if(e.hit>0)col='#fff';g.fillStyle=col;g.fillRect(i,j,1,1)}if(v>.3&&v<.42&&((u>.18&&u<.37)||(u>.63&&u<.82))){g.fillStyle='#f2cf38';g.fillRect(i,j,1,1)}}}}function renderEnemies(){let a=enemies.filter(e=>e.alive);a.sort((a,b)=>Math.hypot(b.x-px,b.y-py)-Math.hypot(a.x-px,a.y-py));for(let i=0;i<a.length;i++)sprite(a[i])}function weapon(){let y=151+recoil;g.fillStyle='#080808';g.fillRect(91,y,138,49);g.fillStyle='#222';g.fillRect(105,y-16,110,48);g.fillStyle='#454545';g.fillRect(124,y-29,72,43);g.fillStyle='#777';g.fillRect(138,y-42,44,40);g.fillStyle='#aaa';g.fillRect(149,y-52,22,30);g.fillStyle='#333';g.fillRect(101,y+34,118,17);g.fillStyle='#555';g.fillRect(132,y,56,31);g.fillStyle='#111';g.fillRect(145,y+7,30,24);if(muzzle>0){g.fillStyle='#fff6a0';g.beginPath();g.moveTo(160,y-64);g.lineTo(137,y-27);g.lineTo(160,y-35);g.lineTo(183,y-27);g.closePath();g.fill();g.fillStyle='#ff7100';g.beginPath();g.moveTo(160,y-55);g.lineTo(151,y-30);g.lineTo(160,y-37);g.lineTo(169,y-30);g.closePath();g.fill()}}function updateHud(){health.textContent='HEALTH '+hp;ammo.textContent='AMMO '+bullets;kills.textContent='KILLS '+score}function fire(){if(!running||shot>0||bullets<=0)return;bullets--;shot=.24;muzzle=5;recoil=-7;let target=null,best=999;for(let i=0;i<enemies.length;i++){let e=enemies[i];if(!e.alive)continue;let dx=e.x-px,dy=e.y-py,d=Math.hypot(dx,dy),a=Math.abs(ang(Math.atan2(dy,dx)-dir));if(d<best&&a<.1&&see(px,py,e.x,e.y)){best=d;target=e}}if(target){target.hp--;target.hit=.12;if(target.hp<=0){target.alive=0;score++}}updateHud()}function enemyAI(dt){for(let i=0;i<enemies.length;i++){let e=enemies[i];if(!e.alive)continue;e.hit=Math.max(0,e.hit-dt);let dx=px-e.x,dy=py-e.y,d=Math.hypot(dx,dy);if(d<8&&see(e.x,e.y,px,py)){if(d>1.2){let s=.32*dt,nx=e.x+dx/d*s,ny=e.y+dy/d*s;if(free(nx,e.y))e.x=nx;if(free(e.x,ny))e.y=ny}else{e.attack+=dt;if(e.attack>.9){e.attack=0;hp=clamp(hp-5,0,100);hitFlash=.4;if(hp<=0){running=0;stateEl.textContent='DOOM // DEAD';msg.textContent='YOU DIED';start.textContent='RETRY';menu.style.display='flex'}}}}}}function reset(){px=2.5;py=1.5;dir=0;hp=100;bullets=50;score=0;shot=0;muzzle=0;recoil=0;hitFlash=0;enemies.length=0;let q=[[7.5,3.5],[16.5,3.5],[4.5,7.5],[13.5,7.5],[18.5,9.5],[8.5,11.5],[16.5,12.5],[4.5,14.5],[20.5,16.5],[11.5,17.5]];for(let i=0;i<q.length;i++)enemies.push({x:q[i][0],y:q[i][1],hp:2,alive:1,hit:0,attack:0});updateHud()}function startGame(e){if(e){e.preventDefault();e.stopPropagation()}if(running)return;reset();running=1;stateEl.textContent='DOOM // RUNNING';menu.style.display='none'}start.addEventListener('pointerdown',startGame,{passive:false});start.addEventListener('touchstart',startGame,{passive:false});start.addEventListener('click',startGame);function button(id,k){let b=document.getElementById(id);let on=e=>{e.preventDefault();e.stopPropagation();keys[k]=1;b.style.background='#700000'},off=e=>{e.preventDefault();keys[k]=0;b.style.background='#292929'};b.addEventListener('pointerdown',on,{passive:false});b.addEventListener('pointerup',off,{passive:false});b.addEventListener('pointercancel',off,{passive:false});b.addEventListener('pointerleave',off,{passive:false})}button('left','l');button('right','r');button('forward','f');button('back','b');button('fire','fire');addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.l=1;if(k==='d'||k==='arrowright')keys.r=1;if(k==='w'||k==='arrowup')keys.f=1;if(k==='s'||k==='arrowdown')keys.b=1;if(k===' ')keys.fire=1;if(k==='enter'&&!running)startGame(e)});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.l=0;if(k==='d'||k==='arrowright')keys.r=0;if(k==='w'||k==='arrowup')keys.f=0;if(k==='s'||k==='arrowdown')keys.b=0;if(k===' ')keys.fire=0});function update(dt){if(!running)return;shot=Math.max(0,shot-dt);muzzle=Math.max(0,muzzle-1);recoil*=.78;hitFlash=Math.max(0,hitFlash-dt);let speed=2.1*dt;if(keys.f)move(Math.cos(dir)*speed,Math.sin(dir)*speed);if(keys.b)move(-Math.cos(dir)*speed*.7,-Math.sin(dir)*speed*.7);if(keys.l)dir-=2.4*dt;if(keys.r)dir+=2.4*dt;if(keys.fire)fire();enemyAI(dt);updateHud()}function render(){background();renderWalls();renderEnemies();weapon();if(hitFlash>0){g.fillStyle='rgba(180,0,0,.25)';g.fillRect(0,0,W,H)}}function loop(t){let dt=last?clamp((t-last)/1000,0,.05):.016;last=t;update(dt);render();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})()</script></body></html>
