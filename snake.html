<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cyber Snake</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(16,185,129,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(6,182,212,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(139,92,246,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #10b981;border-radius:8px;color:#d1fae5;background:rgba(16,185,129,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.stats{display:flex;gap:6px}.stat{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(2,6,23,.6);padding:4px 6px;text-align:center;font-size:11px;font-weight:700;color:#94a3b8}.stat b{display:block;color:#10b981;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800}.reelbox{position:relative;width:100%;aspect-ratio:4/3;min-height:280px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#020617;overflow:hidden;box-shadow:inset 0 2px 10px rgba(0,0,0,.8)}.reelbox canvas{display:block;width:100%;height:100%;touch-action:none}.message{height:26px;display:grid;place-items:center;border:1px solid rgba(16,185,129,.3);border-radius:6px;color:#6ee7b7;background:rgba(2,6,23,.6);text-align:center;font:bold 11px 'JetBrains Mono',monospace}.dpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:180px;margin:4px auto 0;touch-action:none}.dpad button{height:40px;border:1px solid rgba(16,185,129,.4);border-radius:10px;background:rgba(16,185,129,.15);color:#d1fae5;font-weight:900;font-size:18px;touch-action:none;cursor:pointer;transition:transform .08s,background .08s}.dpad button:active{transform:scale(.92);background:#10b981;color:#020617}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:rgba(2,6,23,.9);backdrop-filter:blur(6px)}.over.on{display:grid}.over button{padding:0 24px;height:42px;margin-top:12px;background:#10b981;color:#020617;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">🐍 CYBER SNAKE</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="stats"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">LENGTH<b id="len">3</b></div><div class="stat">BEST<b id="bs">0</b></div></div><div class="reelbox"><canvas id="gc" width="440" height="330"></canvas></div><div class="message" id="msg">USE D-PAD OR SWIPE TO MOVE</div><div class="dpad"><div></div><button id="up">▲</button><div></div><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div class="over" id="over"><div><h2 style="font-size:24px;color:#10b981;font-weight:900">GAME OVER</h2><div id="fs" style="font-size:16px;margin:8px 0;color:#94a3b8"></div><button id="rb">PLAY AGAIN</button></div></div></div></div><script>(()=>{const c=document.getElementById("gc"),x=c.getContext("2d"),box=c.parentElement,rb=document.getElementById("rb"),over=document.getElementById("over"),msg=document.getElementById("msg"),scEl=document.getElementById("sc"),lenEl=document.getElementById("len"),bsEl=document.getElementById("bs"),fs=document.getElementById("fs"),sndBtn=document.getElementById("sndBtn");const btnU=document.getElementById("up"),btnD=document.getElementById("down"),btnL=document.getElementById("left"),btnR=document.getElementById("right");let W=440,H=330,cols=22,rows=18,gridSize=20,snake=[],dir={x:1,y:0},nextDir={x:1,y:0},food={x:10,y:8},score=0,best=0,alive=false,lastTick=0,tickInterval=100;let audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}if(audioCtx.state==="suspended"){audioCtx.resume()}}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==="eat"){osc.type="triangle";osc.frequency.setValueAtTime(523.25,t);osc.frequency.setValueAtTime(783.99,t+.06);gain.gain.setValueAtTime(.3,t);gain.gain.exponentialRampToValueAtTime(.01,t+.18);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.19)}else if(type==="turn"){osc.type="sine";osc.frequency.setValueAtTime(280,t);gain.gain.setValueAtTime(.12,t);gain.gain.exponentialRampToValueAtTime(.01,t+.05);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.06)}else if(type==="die"){osc.type="sawtooth";osc.frequency.setValueAtTime(240,t);osc.frequency.exponentialRampToValueAtTime(40,t+.35);gain.gain.setValueAtTime(.4,t);gain.gain.exponentialRampToValueAtTime(.01,t+.38);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.39)}}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?"🔊":"🔇"};try{best=Number(localStorage.getItem("snake_best"))||0}catch(e){}bsEl.textContent=best;function size(){const rect=box.getBoundingClientRect(),bw=Math.round(rect.width||box.clientWidth||440),bh=Math.round(rect.height||box.clientHeight||330);if(bw>40&&bh>40){W=bw;H=bh;c.width=W;c.height=H}else{W=440;H=330;c.width=W;c.height=H}gridSize=Math.min(W/cols,H/rows)}function spawnFood(){let ok=false;while(!ok){food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};ok=!snake.some(s=>s.x===food.x&&s.y===food.y)}}function reset(){size();snake=[{x:5,y:8},{x:4,y:8},{x:3,y:8}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;alive=true;scEl.textContent=0;lenEl.textContent=3;over.classList.remove("on");spawnFood()}function die(){if(!alive)return;alive=false;playTone("die");best=Math.max(best,score);bsEl.textContent=best;fs.textContent="Final Score: "+score;over.classList.add("on");try{localStorage.setItem("snake_best",best)}catch(e){}}function setDir(dx,dy){initAudio();if(dir.x+dx!==0||dir.y+dy!==0){nextDir={x:dx,y:dy};playTone("turn")}}btnU.addEventListener("pointerdown",e=>{e.preventDefault();setDir(0,-1)});btnD.addEventListener("pointerdown",e=>{e.preventDefault();setDir(0,1)});btnL.addEventListener("pointerdown",e=>{e.preventDefault();setDir(-1,0)});btnR.addEventListener("pointerdown",e=>{e.preventDefault();setDir(1,0)});rb.addEventListener("pointerdown",e=>{e.preventDefault();initAudio();reset()});addEventListener("keydown",e=>{initAudio();if(e.code==="ArrowUp"||e.code==="KeyW")setDir(0,-1);if(e.code==="ArrowDown"||e.code==="KeyS")setDir(0,1);if(e.code==="ArrowLeft"||e.code==="KeyA")setDir(-1,0);if(e.code==="ArrowRight"||e.code==="KeyD")setDir(1,0);if(e.code==="Space"&&!alive)reset()});let touchStartX=0,touchStartY=0;box.addEventListener("touchstart",e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});box.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;if(Math.abs(dx)>Math.abs(dy)){if(Math.abs(dx)>25)setDir(dx>0?1:-1,0)}else{if(Math.abs(dy)>25)setDir(0,dy>0?1:-1)}},{passive:true});function tick(){if(!alive)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){die();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scEl.textContent=score;lenEl.textContent=snake.length;playTone("eat");spawnFood()}else snake.pop()}function draw(){x.clearRect(0,0,W,H);x.fillStyle="#040d09";x.fillRect(0,0,W,H);x.strokeStyle="rgba(16,185,129,.08)";x.lineWidth=1;for(let i=0;i<cols;i++){x.beginPath();x.moveTo(i*gridSize,0);x.lineTo(i*gridSize,H);x.stroke()}for(let j=0;j<rows;j++){x.beginPath();x.moveTo(0,j*gridSize);x.lineTo(W,j*gridSize);x.stroke()}const fx=food.x*gridSize+gridSize/2,fy=food.y*gridSize+gridSize/2;x.save();x.fillStyle="#f43f5e";x.shadowColor="#f43f5e";x.shadowBlur=12;x.beginPath();x.arc(fx,fy,gridSize*.42,0,Math.PI*2);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(fx-2,fy-2,gridSize*.14,0,Math.PI*2);x.fill();x.restore();snake.forEach((s,idx)=>{const sx=s.x*gridSize,sy=s.y*gridSize;x.save();if(idx===0){x.fillStyle="#10b981";x.shadowColor="#34d399";x.shadowBlur=10;x.beginPath();x.roundRect(sx+1,sy+1,gridSize-2,gridSize-2,5);x.fill();x.fillStyle="#020617";x.beginPath();x.arc(sx+gridSize*.35,sy+gridSize*.35,2.5,0,Math.PI*2);x.fill();x.beginPath();x.arc(sx+gridSize*.65,sy+gridSize*.35,2.5,0,Math.PI*2);x.fill()}else{const ratio=1-idx/snake.length;x.fillStyle=ratio>.5?"#059669":"#047857";x.beginPath();x.roundRect(sx+2,sy+2,gridSize-4,gridSize-4,3);x.fill()}x.restore()})}function loop(now){if(!W||!H||W<50||H<50||c.width<50||!gridSize)size();if(now-lastTick>tickInterval){lastTick=now;tick()}draw();requestAnimationFrame(loop)}window.addEventListener("resize",size);window.addEventListener("orientationchange",()=>{setTimeout(size,150)});setTimeout(size,100);setTimeout(size,300);size();reset();requestAnimationFrame(loop)})()</script></body></html>
