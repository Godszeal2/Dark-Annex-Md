<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Memory Match</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(16,185,129,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(6,182,212,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(139,92,246,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #10b981;border-radius:8px;color:#d1fae5;background:rgba(16,185,129,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.stats{display:flex;gap:6px}.stat{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(2,6,23,.6);padding:4px 6px;text-align:center;font-size:11px;font-weight:700;color:#94a3b8}.stat b{display:block;color:#10b981;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:320px;aspect-ratio:1/1;margin:10px auto;padding:10px;perspective:600px;background:rgba(2,6,23,.6);border-radius:16px;border:1px solid rgba(255,255,255,.12)}.card{display:flex;align-items:center;justify-content:center;background:rgba(30,41,59,.8);border:1px solid rgba(255,255,255,.12);border-radius:10px;font-size:24px;cursor:pointer;transition:transform .25s,background .2s;user-select:none}.card.flipped{background:rgba(16,185,129,.25);border-color:#10b981;transform:rotateY(180deg)}.card.matched{background:rgba(6,182,212,.3);border-color:#06b6d4;box-shadow:0 0 10px rgba(6,182,212,.4);cursor:default}.reset-btn{width:100%;height:44px;border:none;border-radius:12px;background:linear-gradient(90deg,#10b981,#059669);color:#020617;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,.4)}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:rgba(2,6,23,.9);backdrop-filter:blur(6px)}.over.on{display:grid}.over button{padding:0 24px;height:42px;margin-top:12px;background:#10b981;color:#020617;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">🃏 MEMORY MATCH</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="stats"><div class="stat">MOVES<b id="mv">0</b></div><div class="stat">MATCHES<b id="mt">0/8</b></div></div><div class="grid" id="grid"></div><button id="rb" class="reset-btn">NEW GAME</button><div class="over" id="over"><div><h2 style="font-size:24px;color:#10b981;font-weight:900">COMPLETED!</h2><div id="fs" style="font-size:16px;margin:8px 0;color:#94a3b8"></div><button id="rb2">PLAY AGAIN</button></div></div></div></div><script>(()=>{const emojis=['🔥','⚡','💎','🚀','🎮','👑','🎯','⭐'],gridEl=document.getElementById("grid"),mvEl=document.getElementById("mv"),mtEl=document.getElementById("mt"),over=document.getElementById("over"),fs=document.getElementById("fs"),rb=document.getElementById("rb"),rb2=document.getElementById("rb2"),sndBtn=document.getElementById("sndBtn");let cards=[],selected=[],moves=0,matches=0,busy=false,audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==='flip'){osc.type='sine';osc.frequency.setValueAtTime(400,t);gain.gain.setValueAtTime(.15,t);gain.gain.exponentialRampToValueAtTime(.01,t+.05);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.06)}else if(type==='match'){osc.type='triangle';osc.frequency.setValueAtTime(587.33,t);osc.frequency.setValueAtTime(880,t+.07);gain.gain.setValueAtTime(.25,t);gain.gain.exponentialRampToValueAtTime(.01,t+.2);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.21)}else if(type==='win'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t+i*.06);g.gain.setValueAtTime(.25,t+i*.06);g.gain.exponentialRampToValueAtTime(.01,t+i*.06+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.06);o.stop(t+i*.06+.17)})}}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?'🔊':'🔇'};function reset(){const deck=[...emojis,...emojis].sort(()=>Math.random()-.5);gridEl.innerHTML="";moves=0;matches=0;selected=[];busy=false;mvEl.textContent=0;mtEl.textContent="0/8";over.classList.remove("on");deck.forEach((val,i)=>{const d=document.createElement("div");d.className="card";d.dataset.val=val;d.dataset.idx=i;d.textContent="❓";d.onclick=()=>flip(d);gridEl.appendChild(d)})}function flip(card){initAudio();if(busy||card.classList.contains("flipped")||card.classList.contains("matched"))return;card.classList.add("flipped");card.textContent=card.dataset.val;playTone('flip');selected.push(card);if(selected.length===2){moves++;mvEl.textContent=moves;busy=true;const[c1,c2]=selected;if(c1.dataset.val===c2.dataset.val){setTimeout(()=>{c1.classList.add("matched");c2.classList.add("matched");matches++;mtEl.textContent=matches+"/8";selected=[];busy=false;playTone('match');if(matches===8){playTone('win');fs.textContent="Cleared in "+moves+" moves!";over.classList.add("on")}},280)}else setTimeout(()=>{c1.classList.remove("flipped");c1.textContent="❓";c2.classList.remove("flipped");c2.textContent="❓";selected=[];busy=false},650)}}rb.onclick=()=>{initAudio();reset()};rb2.onclick=()=>{initAudio();reset()};reset()})()</script></body></html>
