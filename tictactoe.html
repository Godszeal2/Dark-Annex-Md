<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tic-Tac-Toe</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(99,102,241,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(236,72,153,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(6,182,212,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #6366f1;border-radius:8px;color:#e0e7ff;background:rgba(99,102,241,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.modes{display:flex;gap:6px}.modes button{flex:1;height:38px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(30,41,59,.8);color:#94a3b8;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s}.modes button.active{background:#6366f1;color:#fff;border-color:#818cf8;box-shadow:0 0 12px rgba(99,102,241,.4)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:320px;aspect-ratio:1/1;margin:10px auto;padding:10px;background:rgba(2,6,23,.6);border-radius:16px;border:1px solid rgba(255,255,255,.12)}.cell{display:flex;align-items:center;justify-content:center;background:rgba(30,41,59,.8);border-radius:12px;font-size:42px;font-weight:900;font-family:'Outfit',sans-serif;cursor:pointer;transition:transform .08s,background .12s;border:1px solid rgba(255,255,255,.06)}.cell:active{transform:scale(.94)}.cell.X{color:#f43f5e;text-shadow:0 0 14px rgba(244,63,94,.6)}.cell.O{color:#06b6d4;text-shadow:0 0 14px rgba(6,182,212,.6)}.status{height:32px;display:flex;align-items:center;justify-content:center;color:#f8fafc;font-weight:800;font-size:14px;font-family:'JetBrains Mono',monospace;background:rgba(2,6,23,.6);border:1px solid rgba(255,255,255,.1);border-radius:8px;margin:4px 0}.reset-btn{width:100%;height:44px;border:none;border-radius:12px;background:linear-gradient(90deg,#6366f1,#4f46e5);color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">⭕ TIC TAC TOE</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="modes"><button id="vsAi" class="active">VS AI</button><button id="vsP2">2 PLAYERS</button></div><div class="grid" id="grid"></div><div class="status" id="st">PLAYER X TURN</div><button id="rb" class="reset-btn">NEW GAME</button></div></div><script>(()=>{const gridEl=document.getElementById("grid"),st=document.getElementById("st"),rb=document.getElementById("rb"),btnAi=document.getElementById("vsAi"),btnP2=document.getElementById("vsP2"),sndBtn=document.getElementById("sndBtn");let board=["","","","","","","","",""],turn="X",vsAi=true,gameOver=false;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==="tap"){osc.type="sine";osc.frequency.setValueAtTime(turn==="X"?440:550,t);gain.gain.setValueAtTime(.18,t);gain.gain.exponentialRampToValueAtTime(.01,t+.06);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.07)}else if(type==="win"){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.setValueAtTime(f,t+i*.06);g.gain.setValueAtTime(.25,t+i*.06);g.gain.exponentialRampToValueAtTime(.01,t+i*.06+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.06);o.stop(t+i*.06+.17)})}}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?"🔊":"🔇"};function reset(){board=["","","","","","","","",""];turn="X";gameOver=false;st.textContent="PLAYER X TURN";render()}function render(){gridEl.innerHTML="";board.forEach((v,i)=>{const d=document.createElement("div");d.className="cell "+v;d.textContent=v;d.onclick=()=>makeMove(i);gridEl.appendChild(d)})}function checkWin(b){for(const[a,c,d]of wins)if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];if(b.every(x=>x))return"draw";return null}function makeMove(i){initAudio();if(board[i]||gameOver)return;board[i]=turn;playTone("tap");render();const w=checkWin(board);if(w){gameOver=true;if(w!=="draw")playTone("win");st.textContent=w==="draw"?"IT'S A DRAW!":"PLAYER "+w+" WINS! 🏆";return}turn=turn==="X"?"O":"X";st.textContent="PLAYER "+turn+" TURN";if(vsAi&&turn==="O"&&!gameOver)setTimeout(aiMove,300)}function aiMove(){if(gameOver)return;for(let i=0;i<9;i++)if(!board[i]){board[i]="O";if(checkWin(board)==="O"){makeMove(i);return}board[i]=""}for(let i=0;i<9;i++)if(!board[i]){board[i]="X";if(checkWin(board)==="X"){board[i]="";makeMove(i);return}board[i]=""}if(!board[4]){makeMove(4);return}const empties=[];board.forEach((v,i)=>{if(!v)empties.push(i)});if(empties.length){const r=empties[Math.floor(Math.random()*empties.length)];makeMove(r)}}btnAi.onclick=()=>{btnAi.classList.add("active");btnP2.classList.remove("active");vsAi=true;reset()};btnP2.onclick=()=>{btnP2.classList.add("active");btnAi.classList.remove("active");vsAi=false;reset()};rb.onclick=()=>{initAudio();reset()};reset()})()</script></body></html>
