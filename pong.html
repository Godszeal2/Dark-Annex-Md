<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Retro Pong</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(56,189,248,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(99,102,241,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(139,92,246,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #38bdf8;border-radius:8px;color:#e0f2fe;background:rgba(56,189,248,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.stats{display:flex;gap:6px}.stat{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(2,6,23,.6);padding:4px 6px;text-align:center;font-size:11px;font-weight:700;color:#94a3b8}.stat b{display:block;color:#38bdf8;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800}.reelbox{position:relative;width:100%;aspect-ratio:4/3;min-height:280px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#020617;overflow:hidden;box-shadow:inset 0 2px 10px rgba(0,0,0,.8)}.reelbox canvas{display:block;width:100%;height:100%;touch-action:none}.ctrls{display:flex;gap:8px;margin-top:4px}.ctrls button{flex:1;height:44px;border:1px solid rgba(56,189,248,.3);border-radius:10px;background:rgba(30,41,59,.9);color:#fff;font-weight:900;font-size:15px;cursor:pointer;transition:transform .08s,background .08s}.ctrls button:active{transform:scale(.95);background:#38bdf8;color:#020617}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:rgba(2,6,23,.9);backdrop-filter:blur(6px)}.over.on{display:grid}.over button{padding:0 24px;height:42px;margin-top:12px;background:#38bdf8;color:#020617;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(56,189,248,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">🏓 RETRO PONG</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="stats"><div class="stat">YOU<b id="p1">0</b></div><div class="stat">AI OPPONENT<b id="p2">0</b></div></div><div class="reelbox"><canvas id="gc" width="440" height="330"></canvas></div><div class="ctrls"><button id="btnL">◀ LEFT</button><button id="btnR">RIGHT ▶</button></div><div class="over" id="over"><div><h2 id="res" style="font-size:24px;font-weight:900;color:#38bdf8">GAME OVER</h2><button id="rb">PLAY AGAIN</button></div></div></div></div><script>(()=>{const c=document.getElementById("gc"),x=c.getContext("2d"),box=c.parentElement,p1El=document.getElementById("p1"),p2El=document.getElementById("p2"),over=document.getElementById("over"),res=document.getElementById("res"),rb=document.getElementById("rb"),sndBtn=document.getElementById("sndBtn");let W=440,H=330,pw=72,ph=10,playerX=184,aiX=184,ball,s1=0,s2=0,alive=true,audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==='hit'){osc.type='square';osc.frequency.setValueAtTime(440,t);gain.gain.setValueAtTime(.2,t);gain.gain.exponentialRampToValueAtTime(.01,t+.06);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.07)}else if(type==='score'){osc.type='sine';osc.frequency.setValueAtTime(659.25,t);gain.gain.setValueAtTime(.3,t);gain.gain.exponentialRampToValueAtTime(.01,t+.2);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.21)}else if(type==='lose'){osc.type='sawtooth';osc.frequency.setValueAtTime(180,t);gain.gain.setValueAtTime(.35,t);gain.gain.exponentialRampToValueAtTime(.01,t+.28);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.29)}}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?'🔊':'🔇'};function size(){const rect=box.getBoundingClientRect(),bw=Math.round(rect.width||box.clientWidth||440),bh=Math.round(rect.height||box.clientHeight||330);if(bw>40&&bh>40){W=bw;H=bh;c.width=W;c.height=H}else{W=440;H=330;c.width=W;c.height=H}pw=Math.round(W*.18)}function resetBall(dir){ball={x:W/2,y:H/2,vx:(Math.random()-.5)*4+2*(Math.random()<.5?1:-1),vy:dir*3.8,r:6}}function reset(){size();s1=0;s2=0;alive=true;p1El.textContent=0;p2El.textContent=0;playerX=W/2-pw/2;aiX=W/2-pw/2;over.classList.remove("on");resetBall(1)}let leftDown=false,rightDown=false;function setupTouch(btn,down,up){btn.addEventListener("pointerdown",e=>{e.preventDefault();initAudio();down()});btn.addEventListener("pointerup",e=>{e.preventDefault();up()});btn.addEventListener("pointercancel",e=>{e.preventDefault();up()})}setupTouch(document.getElementById("btnL"),()=>leftDown=true,()=>leftDown=false);setupTouch(document.getElementById("btnR"),()=>rightDown=true,()=>rightDown=false);rb.addEventListener("pointerdown",e=>{e.preventDefault();initAudio();reset()});c.addEventListener("pointermove",e=>{const rect=c.getBoundingClientRect();playerX=e.clientX-rect.left-pw/2;playerX=Math.max(0,Math.min(W-pw,playerX))});addEventListener("keydown",e=>{initAudio();if(e.code==="ArrowLeft"||e.code==="KeyA")leftDown=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightDown=true;if(e.code==="Space"&&!alive)reset()});addEventListener("keyup",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")leftDown=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightDown=false});function update(){if(!alive)return;if(leftDown)playerX=Math.max(0,playerX-6.5);if(rightDown)playerX=Math.min(W-pw,playerX+6.5);const aiCenter=aiX+pw/2;if(ball.y<H*.75){if(aiCenter<ball.x-6)aiX=Math.min(W-pw,aiX+4.2);else if(aiCenter>ball.x+6)aiX=Math.max(0,aiX-4.2)}ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x-ball.r<=0){ball.x=ball.r;ball.vx*=-1;playTone('hit')}if(ball.x+ball.r>=W){ball.x=W-ball.r;ball.vx*=-1;playTone('hit')}const py=H-24;if(ball.vy>0&&ball.y+ball.r>=py&&ball.y-ball.r<=py+ph&&ball.x>=playerX-4&&ball.x<=playerX+pw+4){ball.y=py-ball.r;ball.vy*=-1.04;const hitOffset=(ball.x-(playerX+pw/2))/(pw/2);ball.vx=hitOffset*5.2;playTone('hit')}const ay=14;if(ball.vy<0&&ball.y-ball.r<=ay+ph&&ball.y+ball.r>=ay&&ball.x>=aiX-4&&ball.x<=aiX+pw+4){ball.y=ay+ph+ball.r;ball.vy*=-1.03;const hitOffset=(ball.x-(aiX+pw/2))/(pw/2);ball.vx=hitOffset*4.8;playTone('hit')}if(ball.y<0){s1++;p1El.textContent=s1;playTone('score');if(s1>=5){alive=false;res.textContent="YOU WON! 🏆";res.style.color="#38bdf8";over.classList.add("on")}else resetBall(1)}if(ball.y>H){s2++;p2El.textContent=s2;playTone('lose');if(s2>=5){alive=false;res.textContent="AI WON!";res.style.color="#f43f5e";over.classList.add("on")}else resetBall(-1)}}function draw(){x.clearRect(0,0,W,H);x.fillStyle="#020617";x.fillRect(0,0,W,H);x.strokeStyle="rgba(255,255,255,.15)";x.lineWidth=2;x.setLineDash([8,8]);x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.stroke();x.setLineDash([]);x.fillStyle="#f43f5e";x.beginPath();x.roundRect(aiX,14,pw,ph,5);x.fill();x.fillStyle="#38bdf8";x.beginPath();x.roundRect(playerX,H-24,pw,ph,5);x.fill();if(ball){x.save();x.fillStyle="#facc15";x.shadowColor="#facc15";x.shadowBlur=12;x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.restore()}}function loop(){if(!W||!H||W<50||H<50||c.width<50)size();update();draw();requestAnimationFrame(loop)}window.addEventListener('resize',size);window.addEventListener('orientationchange',()=>{setTimeout(size,150)});setTimeout(size,100);setTimeout(size,300);size();reset();requestAnimationFrame(loop)})()</script></body></html>
