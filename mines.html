<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;margin:0;padding:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#070b16;color:#f8fafc}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(56,189,248,.18) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(99,102,241,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(139,92,246,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.arcade-box{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;z-index:2}.title-badge{background:linear-gradient(90deg,#38bdf8,#818cf8);color:#030712;font-size:13px;font-weight:900;letter-spacing:1px;padding:3px 8px;border-radius:6px;text-shadow:0 1px 0 rgba(255,255,255,.4)}.stats-bar{display:flex;gap:6px}.stat-pill{background:rgba(0,0,0,.6);border:1px solid rgba(56,189,248,.4);border-radius:6px;padding:3px 7px;font-size:12px;font-weight:800;color:#38bdf8;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}.top-controls{display:flex;align-items:center;justify-content:space-between;background:rgba(15,23,42,.7);border:1px solid rgba(56,189,248,.25);border-radius:10px;padding:6px 10px;margin-bottom:6px;z-index:2}.digital-display{background:#020617;border:1px solid #1e293b;border-radius:5px;color:#ef4444;font-family:'Courier New',monospace;font-weight:900;font-size:18px;padding:2px 8px;letter-spacing:2px;min-width:54px;text-align:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.8)}.digital-display.timer{color:#38bdf8}.face-btn{font-size:22px;background:#1e293b;border:2px solid #38bdf8;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.4);transition:transform .1s}.face-btn:active{transform:scale(.92)}.diff-selector{display:flex;gap:4px;margin-bottom:6px;z-index:2}.diff-btn{flex:1;background:rgba(15,23,42,.8);border:1px solid rgba(56,189,248,.2);color:#94a3b8;font-size:11px;font-weight:700;padding:5px;border-radius:6px;cursor:pointer;text-align:center;transition:all .15s}.diff-btn.active{background:#0284c7;color:#fff;border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.4)}.screen-frame{position:relative;width:100%;min-height:320px;border-radius:12px;border:2px solid #0f172a;overflow:hidden;background:#020617;box-shadow:inset 0 0 12px rgba(0,0,0,.9),0 4px 10px rgba(0,0,0,.5);display:flex;justify-content:center;align-items:center;padding:8px}.grid-container{display:grid;gap:3px;width:100%;max-width:360px;aspect-ratio:1/1}.cell{background:#1e293b;border-radius:4px;border:1px solid #334155;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;cursor:pointer;transition:background .1s,transform .05s;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 2px rgba(0,0,0,.4)}.cell:active{transform:scale(.94)}.cell.revealed{background:#0f172a;border-color:#1e293b;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}.cell.mine{background:#dc2626!important;border-color:#ef4444!important}.cell.flagged{color:#f43f5e}.cell[data-count="1"]{color:#38bdf8}.cell[data-count="2"]{color:#4ade80}.cell[data-count="3"]{color:#f87171}.cell[data-count="4"]{color:#c084fc}.cell[data-count="5"]{color:#fbbf24}.cell[data-count="6"]{color:#2dd4bf}.cell[data-count="7"]{color:#f43f5e}.cell[data-count="8"]{color:#e2e8f0}.bottom-bar{display:flex;align-items:center;justify-content:space-between;margin-top:6px;z-index:2;gap:8px}.mode-toggle{flex:1;background:#1e293b;border:1px solid #38bdf8;color:#f8fafc;font-size:12px;font-weight:800;padding:8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}.mode-toggle.active{background:linear-gradient(90deg,#e11d48,#be123c);border-color:#fb7185;color:#fff;box-shadow:0 0 12px rgba(244,63,94,.4)}.icon-btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}.overlay{position:absolute;inset:0;background:rgba(2,6,23,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20}.overlay.hidden{display:none}.overlay h2{font-size:24px;font-weight:900;color:#38bdf8;letter-spacing:1px}.overlay.win h2{color:#4ade80}.overlay.lose h2{color:#f87171}.play-btn{background:linear-gradient(90deg,#0284c7,#2563eb);color:#fff;font-size:14px;font-weight:800;padding:8px 24px;border-radius:8px;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(2,132,199,.5)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="arcade-box"><div class="header"><div class="title-badge">💣 MINESWEEPER</div><div class="stats-bar"><div class="stat-pill">BEST: <span id="bestTime">--</span>s</div></div></div><div class="diff-selector"><div class="diff-btn active" data-diff="easy">EASY (8x8)</div><div class="diff-btn" data-diff="med">MED (10x10)</div><div class="diff-btn" data-diff="hard">HARD (12x12)</div></div><div class="top-controls"><div class="digital-display" id="mineDisplay">010</div><div class="face-btn" id="faceBtn">🙂</div><div class="digital-display timer" id="timerDisplay">000</div></div><div class="screen-frame"><div class="grid-container" id="gridContainer"></div><div class="overlay hidden" id="gameOverOverlay"><h2 id="overlayTitle">GAME OVER</h2><p style="color:#94a3b8;font-size:13px" id="overlayMsg">You detonated a mine!</p><button class="play-btn" id="playAgainBtn">PLAY AGAIN</button></div></div><div class="bottom-bar"><button class="mode-toggle" id="flagModeBtn"><span>🚩</span> FLAG MODE: <b id="flagStatus">OFF</b></button><button class="icon-btn" id="soundBtn">🔊</button></div></div></div><script>(()=>{let audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function playTone(freq,dur,type='sine'){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.2,t);gain.gain.exponentialRampToValueAtTime(.001,t+dur);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+dur)}catch(e){}}const CONFIGS={easy:{size:8,mines:10},med:{size:10,mines:18},hard:{size:12,mines:28}};let currentDiff='easy',size=8,mineCount=10,grid=[],revealedCount=0,flagMode=false,gameOver=false,timer=0,timerInterval=null,gameStarted=false;const gridContainer=document.getElementById('gridContainer'),mineDisplay=document.getElementById('mineDisplay'),timerDisplay=document.getElementById('timerDisplay'),faceBtn=document.getElementById('faceBtn'),flagModeBtn=document.getElementById('flagModeBtn'),flagStatus=document.getElementById('flagStatus'),soundBtn=document.getElementById('soundBtn'),bestTimeEl=document.getElementById('bestTime'),gameOverOverlay=document.getElementById('gameOverOverlay'),overlayTitle=document.getElementById('overlayTitle'),overlayMsg=document.getElementById('overlayMsg'),playAgainBtn=document.getElementById('playAgainBtn');function updateBestDisplay(){try{const best=localStorage.getItem('minesweeper_best_'+currentDiff);bestTimeEl.textContent=best?best:'--'}catch(e){bestTimeEl.textContent='--'}}function startTimer(){if(timerInterval)clearInterval(timerInterval);timer=0;timerDisplay.textContent='000';timerInterval=setInterval(()=>{timer++;timerDisplay.textContent=String(Math.min(999,timer)).padStart(3,'0')},1000)}function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}function initGame(){stopTimer();gameOver=false;gameStarted=false;revealedCount=0;faceBtn.textContent='🙂';gameOverOverlay.classList.add('hidden');timerDisplay.textContent='000';const cfg=CONFIGS[currentDiff];size=cfg.size;mineCount=cfg.mines;mineDisplay.textContent=String(mineCount).padStart(3,'0');gridContainer.style.gridTemplateColumns=`repeat(${size},1fr)`;gridContainer.style.gridTemplateRows=`repeat(${size},1fr)`;gridContainer.innerHTML='';grid=[];for(let r=0;r<size;r++){grid[r]=[];for(let c=0;c<size;c++){const el=document.createElement('div');el.className='cell';el.dataset.r=r;el.dataset.c=c;gridContainer.appendChild(el);grid[r][c]={r,c,isMine:false,revealed:false,flagged:false,neighborMines:0,el};el.addEventListener('click',()=>onCellClick(r,c));let pressTimer=null;el.addEventListener('touchstart',()=>{pressTimer=setTimeout(()=>{toggleFlag(r,c);pressTimer=null},450)});el.addEventListener('touchend',()=>{if(pressTimer)clearTimeout(pressTimer)})}}updateBestDisplay()}function plantMines(firstR,firstC){let planted=0;while(planted<mineCount){const r=Math.floor(Math.random()*size),c=Math.floor(Math.random()*size);if(r===firstR&&c===firstC||grid[r][c].isMine)continue;if(Math.abs(r-firstR)<=1&&Math.abs(c-firstC)<=1)continue;grid[r][c].isMine=true;planted++}for(let r=0;r<size;r++)for(let c=0;c<size;c++){if(grid[r][c].isMine)continue;let count=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<size&&nc>=0&&nc<size&&grid[nr][nc].isMine)count++}grid[r][c].neighborMines=count}}function onCellClick(r,c){if(gameOver)return;const cell=grid[r][c];if(flagMode){toggleFlag(r,c);return}if(cell.flagged||cell.revealed)return;if(!gameStarted){gameStarted=true;plantMines(r,c);startTimer()}revealCell(r,c)}function toggleFlag(r,c){if(gameOver)return;const cell=grid[r][c];if(cell.revealed)return;cell.flagged=!cell.flagged;if(cell.flagged){cell.el.textContent='🚩';cell.el.classList.add('flagged');playTone(550,.08,'triangle')}else{cell.el.textContent='';cell.el.classList.remove('flagged');playTone(350,.06,'triangle')}let flagsPlaced=0;for(let row=0;row<size;row++)for(let col=0;col<size;col++)if(grid[row][col].flagged)flagsPlaced++;const remaining=Math.max(0,mineCount-flagsPlaced);mineDisplay.textContent=String(remaining).padStart(3,'0')}function revealCell(r,c){const cell=grid[r][c];if(cell.revealed||cell.flagged)return;cell.revealed=true;cell.el.classList.add('revealed');revealedCount++;if(cell.isMine){cell.el.classList.add('mine');cell.el.textContent='💣';triggerGameOver(false);return}playTone(400+cell.neighborMines*60,.07,'sine');if(cell.neighborMines>0){cell.el.textContent=cell.neighborMines;cell.el.dataset.count=cell.neighborMines}else for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<size&&nc>=0&&nc<size)revealCell(nr,nc)}const totalSafe=size*size-mineCount;if(revealedCount===totalSafe)triggerGameOver(true)}function triggerGameOver(won){gameOver=true;stopTimer();faceBtn.textContent=won?'😎':'😵';if(won){playTone(880,.25,'triangle');setTimeout(()=>playTone(1174,.35,'triangle'),200);try{const best=Number(localStorage.getItem('minesweeper_best_'+currentDiff))||9999;if(timer<best){localStorage.setItem('minesweeper_best_'+currentDiff,timer);updateBestDisplay()}}catch(e){}overlayTitle.textContent='VICTORY!';overlayMsg.textContent=`Cleared in ${timer} seconds!`;gameOverOverlay.className='overlay win'}else{playTone(120,.4,'sawtooth');for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(grid[r][c].isMine){grid[r][c].el.classList.add('mine');grid[r][c].el.textContent='💣'}overlayTitle.textContent='MINE DETONATED';overlayMsg.textContent='Better luck next tactical sweep!';gameOverOverlay.className='overlay lose'}gameOverOverlay.classList.remove('hidden')}flagModeBtn.onclick=()=>{flagMode=!flagMode;flagStatus.textContent=flagMode?'ON':'OFF';flagModeBtn.classList.toggle('active',flagMode)};soundBtn.onclick=()=>{soundEnabled=!soundEnabled;soundBtn.textContent=soundEnabled?'🔊':'🔇'};faceBtn.onclick=initGame;playAgainBtn.onclick=initGame;document.querySelectorAll('.diff-btn').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentDiff=btn.dataset.diff;initGame()}});initGame()})()</script></body></html>
