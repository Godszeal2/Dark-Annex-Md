<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Connect 4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(59,130,246,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(239,68,68,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(234,179,8,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #3b82f6;border-radius:8px;color:#dbeafe;background:rgba(59,130,246,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.status{height:34px;display:flex;align-items:center;justify-content:center;color:#f8fafc;font-weight:800;font-size:14px;font-family:'JetBrains Mono',monospace;background:rgba(2,6,23,.6);border:1px solid rgba(255,255,255,.1);border-radius:8px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;max-width:380px;aspect-ratio:7/6;margin:6px auto;padding:10px;background:rgba(30,58,138,.6);border-radius:16px;border:1px solid rgba(59,130,246,.4);box-shadow:inset 0 4px 12px rgba(0,0,0,.6)}.cell{display:flex;align-items:center;justify-content:center;background:#0f172a;border-radius:50%;cursor:pointer;box-shadow:inset 0 3px 6px rgba(0,0,0,.8);transition:transform .08s,background .15s}.cell:active{transform:scale(.92)}.cell.R{background:radial-gradient(circle at 35% 35%,#f87171,#ef4444 60%,#991b1b);box-shadow:0 0 12px rgba(239,68,68,.6)}.cell.Y{background:radial-gradient(circle at 35% 35%,#fde047,#eab308 60%,#854d0e);box-shadow:0 0 12px rgba(234,179,8,.6)}.reset-btn{width:100%;height:44px;border:none;border-radius:12px;background:linear-gradient(90deg,#3b82f6,#2563eb);color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(59,130,246,.4)}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:rgba(2,6,23,.9);backdrop-filter:blur(6px)}.over.on{display:grid}.over button{padding:0 24px;height:42px;margin-top:12px;background:#3b82f6;color:#fff;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(59,130,246,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">🔴 CONNECT 4</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="status" id="st">YOUR TURN (RED)</div><div class="grid" id="grid"></div><button id="rb" class="reset-btn">NEW GAME</button><div class="over" id="over"><div><h2 id="res" style="font-size:24px;font-weight:900;color:#3b82f6">GAME OVER</h2><button id="rb2">PLAY AGAIN</button></div></div></div></div><script>(()=>{const rows=6,cols=7;let board=[],turn="R",gameOver=false;const gridEl=document.getElementById("grid"),st=document.getElementById("st"),over=document.getElementById("over"),res=document.getElementById("res"),rb=document.getElementById("rb"),rb2=document.getElementById("rb2"),sndBtn=document.getElementById("sndBtn");let audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==="drop"){osc.type="triangle";osc.frequency.setValueAtTime(440,t);osc.frequency.exponentialRampToValueAtTime(180,t+.1);gain.gain.setValueAtTime(.25,t);gain.gain.exponentialRampToValueAtTime(.01,t+.1);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.11)}else if(type==="win")[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.setValueAtTime(f,t+i*.06);g.gain.setValueAtTime(.25,t+i*.06);g.gain.exponentialRampToValueAtTime(.01,t+i*.06+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.06);o.stop(t+i*.06+.17)})}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?"🔊":"🔇"};function reset(){board=Array.from({length:rows},()=>Array(cols).fill(""));turn="R";gameOver=false;st.textContent="YOUR TURN (RED)";over.classList.remove("on");render()}function render(){gridEl.innerHTML="";for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const d=document.createElement("div");d.className="cell "+board[r][c];d.onclick=()=>drop(c);gridEl.appendChild(d)}}function drop(col){initAudio();if(gameOver||board[0][col])return;for(let r=rows-1;r>=0;r--)if(!board[r][col]){board[r][col]=turn;playTone("drop");break}render();if(checkWin(turn)){gameOver=true;playTone("win");res.textContent=turn==="R"?"YOU WON! 🏆":"AI WON!";res.style.color=turn==="R"?"#22c55e":"#ef4444";over.classList.add("on");return}if(board.every(row=>row.every(c=>c))){gameOver=true;res.textContent="IT'S A DRAW!";res.style.color="#eab308";over.classList.add("on");return}turn=turn==="R"?"Y":"R";st.textContent=turn==="R"?"YOUR TURN (RED)":"AI THINKING...";if(turn==="Y"&&!gameOver)setTimeout(aiTurn,350)}function checkWin(p){for(let r=0;r<rows;r++)for(let c=0;c<cols-3;c++)if(board[r][c]===p&&board[r][c+1]===p&&board[r][c+2]===p&&board[r][c+3]===p)return true;for(let r=0;r<rows-3;r++)for(let c=0;c<cols;c++)if(board[r][c]===p&&board[r+1][c]===p&&board[r+2][c]===p&&board[r+3][c]===p)return true;for(let r=0;r<rows-3;r++)for(let c=0;c<cols-3;c++)if(board[r][c]===p&&board[r+1][c+1]===p&&board[r+2][c+2]===p&&board[r+3][c+3]===p)return true;for(let r=3;r<rows;r++)for(let c=0;c<cols-3;c++)if(board[r][c]===p&&board[r-1][c+1]===p&&board[r-2][c+2]===p&&board[r-3][c+3]===p)return true;return false}function aiTurn(){if(gameOver)return;for(let c=0;c<cols;c++)if(!board[0][c]){let rIdx=-1;for(let r=rows-1;r>=0;r--)if(!board[r][c]){rIdx=r;break}board[rIdx][c]="Y";if(checkWin("Y")){board[rIdx][c]="";drop(c);return}board[rIdx][c]=""}for(let c=0;c<cols;c++)if(!board[0][c]){let rIdx=-1;for(let r=rows-1;r>=0;r--)if(!board[r][c]){rIdx=r;break}board[rIdx][c]="R";if(checkWin("R")){board[rIdx][c]="";drop(c);return}board[rIdx][c]=""}const validCols=[3,2,4,1,5,0,6].filter(c=>!board[0][c]);if(validCols.length)drop(validCols[0])}rb.onclick=()=>{initAudio();reset()};rb2.onclick=()=>{initAudio();reset()};reset()})()</script></body></html>
