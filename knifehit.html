<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Knife Hit</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(239,68,68,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(249,115,22,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(139,92,246,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #ef4444;border-radius:8px;color:#fee2e2;background:rgba(239,68,68,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.stats{display:flex;gap:6px}.stat{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(2,6,23,.6);padding:4px 6px;text-align:center;font-size:11px;font-weight:700;color:#94a3b8}.stat b{display:block;color:#ef4444;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800}.reelbox{position:relative;width:100%;aspect-ratio:4/3;min-height:280px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#0b0f19;overflow:hidden;box-shadow:inset 0 2px 10px rgba(0,0,0,.8);cursor:pointer}.reelbox canvas{display:block;width:100%;height:100%;touch-action:none}.btn-throw{width:100%;height:46px;border:none;border-radius:12px;background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff;font-weight:900;font-size:16px;cursor:pointer;transition:transform .08s;box-shadow:0 4px 14px rgba(239,68,68,.4);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}.btn-throw:active{transform:scale(.96)}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:rgba(2,6,23,.9);backdrop-filter:blur(6px)}.over.on{display:grid}.over button{padding:0 24px;height:42px;margin-top:12px;background:#ef4444;color:#fff;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(239,68,68,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">🔪 KNIFE HIT</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="stats"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">KNIVES<b id="kn">7</b></div><div class="stat">STAGE<b id="st">1</b></div></div><div class="reelbox"><canvas id="gc" width="440" height="330"></canvas></div><button id="btnT" class="btn-throw">THROW KNIFE (TAP) 🔪</button><div class="over" id="over"><div><h2 style="font-size:24px;color:#ef4444;font-weight:900">GAME OVER</h2><div id="fs" style="font-size:16px;margin:8px 0;color:#94a3b8"></div><button id="rb">PLAY AGAIN</button></div></div></div></div><script>(()=>{const c=document.getElementById("gc"),x=c.getContext("2d"),box=c.parentElement,scEl=document.getElementById("sc"),knEl=document.getElementById("kn"),stEl=document.getElementById("st"),over=document.getElementById("over"),fs=document.getElementById("fs"),rb=document.getElementById("rb"),btnT=document.getElementById("btnT"),sndBtn=document.getElementById("sndBtn");let W=440,H=330,rotation=0,rotSpeed=.035,knivesInTarget=[],knivesLeft=7,score=0,stage=1,flyingKnife=null,alive=false;let audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==='throw'){osc.type='sine';osc.frequency.setValueAtTime(440,t);osc.frequency.exponentialRampToValueAtTime(180,t+.1);gain.gain.setValueAtTime(.18,t);gain.gain.exponentialRampToValueAtTime(.01,t+.1);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.11)}else if(type==='hit'){osc.type='triangle';osc.frequency.setValueAtTime(600,t);osc.frequency.exponentialRampToValueAtTime(300,t+.08);gain.gain.setValueAtTime(.3,t);gain.gain.exponentialRampToValueAtTime(.01,t+.09);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.1)}else if(type==='fail'){osc.type='sawtooth';osc.frequency.setValueAtTime(150,t);osc.frequency.exponentialRampToValueAtTime(40,t+.35);gain.gain.setValueAtTime(.4,t);gain.gain.exponentialRampToValueAtTime(.01,t+.36);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.37)}else if(type==='stage'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(f,t+i*.06);g.gain.setValueAtTime(.2,t+i*.06);g.gain.exponentialRampToValueAtTime(.01,t+i*.06+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.06);o.stop(t+i*.06+.16)})}}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?'🔊':'🔇'};function size(){const rect=box.getBoundingClientRect(),bw=Math.round(rect.width||box.clientWidth||440),bh=Math.round(rect.height||box.clientHeight||330);if(bw>40&&bh>40){W=bw;H=bh;c.width=W;c.height=H}else{W=440;H=330;c.width=W;c.height=H}}function initStage(){knivesInTarget=[];knivesLeft=6+Math.min(stage,4);knEl.textContent=knivesLeft;stEl.textContent=stage;rotSpeed=(.035+stage*.005)*(Math.random()<.5?1:-1);flyingKnife=null;const initial=Math.min(2+Math.floor(stage/2),4);for(let i=0;i<initial;i++)knivesInTarget.push(i*(Math.PI*2/initial)+(Math.random()-.5)*.2)}function reset(){size();score=0;stage=1;alive=true;scEl.textContent=0;over.classList.remove("on");initStage()}function throwKnife(){if(!alive)return;initAudio();if(flyingKnife||knivesLeft<=0)return;flyingKnife={y:H-40,speed:15};knivesLeft--;knEl.textContent=knivesLeft;playTone('throw')}btnT.onpointerdown=e=>{e.preventDefault();throwKnife()};c.onpointerdown=e=>{e.preventDefault();throwKnife()};rb.onpointerdown=e=>{e.preventDefault();initAudio();reset()};addEventListener("keydown",e=>{initAudio();if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();if(!alive)reset();else throwKnife()}});function update(){if(!alive)return;rotation+=rotSpeed;const targetY=H*.35,targetR=Math.min(W,H)*.24;if(flyingKnife){flyingKnife.y-=flyingKnife.speed;if(flyingKnife.y<=targetY+targetR){const currentAngle=Math.PI/2-rotation;let clash=false;const threshold=.18;for(let angle of knivesInTarget){let diff=Math.abs(((angle-currentAngle)%(Math.PI*2)+(Math.PI*3))%(Math.PI*2)-Math.PI);if(diff<threshold){clash=true;break}}if(clash){alive=false;playTone('fail');fs.textContent="Score: "+score+" | Stage: "+stage;over.classList.add("on");flyingKnife=null;return}knivesInTarget.push(currentAngle);flyingKnife=null;score+=10;scEl.textContent=score;playTone('hit');if(knivesLeft===0){stage++;playTone('stage');initStage()}}}}function draw(){x.clearRect(0,0,W,H);x.fillStyle="#0b0f19";x.fillRect(0,0,W,H);const targetX=W/2,targetY=H*.35,targetR=Math.min(W,H)*.24;x.save();x.translate(targetX,targetY);x.rotate(rotation);x.fillStyle="#78350f";x.beginPath();x.arc(0,0,targetR,0,Math.PI*2);x.fill();x.fillStyle="#92400e";x.beginPath();x.arc(0,0,targetR*.75,0,Math.PI*2);x.fill();x.fillStyle="#b45309";x.beginPath();x.arc(0,0,targetR*.45,0,Math.PI*2);x.fill();x.fillStyle="#d97706";x.beginPath();x.arc(0,0,targetR*.18,0,Math.PI*2);x.fill();knivesInTarget.forEach(angle=>{x.save();x.rotate(angle);x.translate(0,targetR);x.fillStyle="#e2e8f0";x.beginPath();x.moveTo(-3,0);x.lineTo(3,0);x.lineTo(0,24);x.closePath();x.fill();x.fillStyle="#ef4444";x.fillRect(-3,24,6,14);x.restore()});x.restore();if(flyingKnife){x.save();x.translate(targetX,flyingKnife.y);x.fillStyle="#e2e8f0";x.beginPath();x.moveTo(-3,0);x.lineTo(3,0);x.lineTo(0,-24);x.closePath();x.fill();x.fillStyle="#ef4444";x.fillRect(-3,0,6,14);x.restore()}if(knivesLeft>0&&!flyingKnife){x.save();x.translate(targetX,H-36);x.fillStyle="#e2e8f0";x.beginPath();x.moveTo(-3,0);x.lineTo(3,0);x.lineTo(0,-24);x.closePath();x.fill();x.fillStyle="#ef4444";x.fillRect(-3,0,6,14);x.restore()}}function loop(){if(!W||!H||W<50||H<50||c.width<50)size();update();draw();requestAnimationFrame(loop)}window.addEventListener('resize',size);window.addEventListener('orientationchange',()=>{setTimeout(size,150)});setTimeout(size,100);setTimeout(size,300);size();reset();requestAnimationFrame(loop)})()</script></body></html>
