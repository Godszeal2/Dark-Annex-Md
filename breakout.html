<html><head><style>*{box-sizing:border-box}html,body{margin:0;width:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;overscroll-behavior:none}body{padding:5px;background:radial-gradient(circle at 50% 10%,#3a6ea5,#0d1b2a 60%,#020508)}.machine{position:relative;overflow:hidden;width:100%;padding:11px;border:4px solid #0a1a2b;border-radius:26px;background:linear-gradient(105deg,#04121f,#1c5a8c 8%,#0a2e4a 20%,#20507a 52%,#0c2338 82%,#2a6ba3 94%,#03101c);box-shadow:inset 0 0 0 3px #ffd23f,inset 0 0 0 7px #0a2338,0 8px 0 #050d14,0 14px 24px #000c;touch-action:none}.machine:before{content:"";position:absolute;inset:7px;border:2px solid #ffd23f;border-radius:19px;pointer-events:none}.lights{height:8px;margin:0 10px 7px;border:2px solid #0a2338;border-radius:8px;background:repeating-radial-gradient(circle at 6px 50%,#fffbd3 0 2px,#ffbd00 3px 5px,#0a2338 6px 12px);box-shadow:0 0 12px #ffbd00;animation:l .55s steps(2) infinite}.title{padding:9px 4px 7px;border:3px solid #ffd23f;border-radius:50% 50% 11px 11px/30% 30% 10px 10px;color:#fff2a1;background:radial-gradient(ellipse at 50% 0,#4ecdc4,#0d1b2a 70%);box-shadow:inset 0 0 0 4px #0a2338,inset 0 -11px 18px #000d,0 4px 0 #030608;text-align:center;font:24px Impact,Arial Black,sans-serif;letter-spacing:1px;text-shadow:0 3px #04121f,2px 0 #04121f,-2px 0 #04121f}.stats{display:flex;margin:7px 1px;padding:5px;border:2px solid #1c5a8c;border-radius:9px;background:linear-gradient(#04121f,#010305);box-shadow:inset 0 0 9px #000,0 3px 0 #0a2338}.stat{flex:1;border-right:1px solid #1c5a8c;color:#8fb8d6;text-align:center;font:bold 10px monospace}.stat:last-child{border:0}.stat b{display:block;margin-top:2px;color:#fff0bb;font-size:15px;text-shadow:0 0 6px #4ecdc4}.frame{position:relative;padding:7px;border:5px solid #12466e;border-radius:16px;background:linear-gradient(90deg,#04121f,#ffd873 5%,#0a2e4a 10%,#0a2e4a 90%,#ffd873 95%,#03101c);box-shadow:inset 0 0 0 3px #020508,0 4px 0 #030a10,0 8px 15px #000b}.reelbox{height:255px;border:3px solid #020508;border-radius:10px;background:#07111d;overflow:hidden}.reelbox canvas{display:block;width:100%;height:100%;touch-action:none}.message{height:32px;margin:7px 1px 6px;display:grid;place-items:center;border:2px solid #1c5a8c;border-radius:8px;color:#ffd46a;background:#04121f;box-shadow:inset 0 0 8px #000;text-align:center;font:bold 14px monospace;text-shadow:0 0 7px #4ecdc4}.console{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:7px;margin:0 2px;padding:8px 7px 11px;border:3px solid #12466e;border-radius:9px 9px 15px 15px;background:linear-gradient(#3a6ea5,#0d2b45 37%,#020508 39%,#0a2338);box-shadow:inset 0 2px #a0d8ff,0 5px #030a10,0 9px 12px #0008;transform:perspective(300px) rotateX(4deg)}button{height:51px;border:3px solid #351006;border-radius:13px;color:#fff;font-weight:900;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}.move{background:linear-gradient(#5d86a8,#183c5a 55%,#071a2a);box-shadow:inset 0 3px 4px #b8dfff,0 4px #04101a;font-size:28px}.move:active{transform:translateY(3px);box-shadow:inset 0 2px 3px #b8dfff,0 1px #04101a}.spin{background:radial-gradient(circle at 50% 32%,#8aff77,#20a72d 47%,#075b17 76%);box-shadow:inset 0 4px 5px #e3ffdc,0 4px #07350e,0 0 14px #3cff4a;font-size:18px;text-shadow:0 2px #06420d}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#ffe5a0;background:#080100ed}.over.on{display:grid}.over button{padding:0 22px;margin-top:14px;background:#ffd15a;color:#271204}@keyframes l{50%{filter:brightness(1.7)}}</style></head><body><div class="machine"><div class="lights"></div><div class="title">BREAKOUT</div><div class="stats"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">VIDAS<b id="lv">3</b></div></div><div class="frame"><div class="reelbox"><canvas id="gc"></canvas></div></div><div class="message" id="msg">TOCA JUGAR</div><div class="console"><button id="left" class="move" type="button">←</button><button id="spin" class="spin" type="button">JUGAR</button><button id="right" class="move" type="button">→</button></div><div class="over" id="over"><div><h2 id="ot">GAME OVER</h2><div id="fs"></div><button id="rb" type="button">REINTENTAR</button></div></div></div><script>(()=>{const c=document.getElementById("gc"),x=c.getContext("2d"),box=c.parentElement,spin=document.getElementById("spin"),rb=document.getElementById("rb"),left=document.getElementById("left"),right=document.getElementById("right"),over=document.getElementById("over"),msg=document.getElementById("msg"),sc=document.getElementById("sc"),lv=document.getElementById("lv"),fs=document.getElementById("fs"),ot=document.getElementById("ot");let W,H,state="START",score=0,lives=3,last=0,px,ball,bricks=[],rows=5,cols=7,dir=0;function size(){W=box.clientWidth||320;H=box.clientHeight||255;c.width=W;c.height=H}function make(){bricks=[];let bw=(W-32-(cols-1)*4)/cols;for(let r=0;r<rows;r++)for(let q=0;q<cols;q++)bricks.push({x:16+q*(bw+4),y:22+r*18,w:bw,h:14,on:1,row:r})}function reset(){size();score=0;lives=3;sc.textContent=0;lv.textContent=3;px=W/2-38;ball={x:W/2,y:H-42,vx:1.375,vy:-1.75,r:5};make();state="READY";msg.textContent="TOCA PARA LANZAR";over.classList.remove("on");ot.textContent="GAME OVER";spin.textContent="JUGAR"}function launch(){if(state==="READY"){state="GAME";msg.textContent=""}}function start(){reset();launch()}function lose(){lives--;lv.textContent=lives;if(lives<=0){state="OVER";fs.textContent="Puntaje: "+score;over.classList.add("on");msg.textContent="FIN DEL JUEGO";return}ball={x:W/2,y:H-42,vx:(Math.random()<.5?-1:1)*1.375,vy:-1.75,r:5};px=W/2-38;state="READY";msg.textContent="TOCA PARA LANZAR"}function win(){state="OVER";ot.textContent="¡GANASTE!";fs.textContent="Puntaje: "+score;over.classList.add("on");msg.textContent="NIVEL COMPLETADO"}function ctl(e,f){e.preventDefault();e.stopPropagation();f()}function hold(v){dir=v}function stop(){dir=0}left.addEventListener("pointerdown",e=>ctl(e,()=>hold(-1)));right.addEventListener("pointerdown",e=>ctl(e,()=>hold(1)));left.addEventListener("pointerup",stop);left.addEventListener("pointercancel",stop);left.addEventListener("pointerleave",stop);right.addEventListener("pointerup",stop);right.addEventListener("pointercancel",stop);right.addEventListener("pointerleave",stop);spin.addEventListener("pointerdown",e=>ctl(e,start));rb.addEventListener("pointerdown",e=>ctl(e,()=>{reset();launch()}));c.addEventListener("pointerdown",e=>ctl(e,()=>{if(state==="READY")launch()}));c.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});addEventListener("keydown",e=>{if(e.key==="ArrowLeft")dir=-1;if(e.key==="ArrowRight")dir=1;if(e.code==="Space"){e.preventDefault();if(state==="START")start();else if(state==="READY")launch()}});addEventListener("keyup",e=>{if(e.key==="ArrowLeft"&&dir<0)dir=0;if(e.key==="ArrowRight"&&dir>0)dir=0});function update(){if(state!=="GAME")return;px+=dir*6;px=Math.max(5,Math.min(W-81,px));let b=ball;b.x+=b.vx;b.y+=b.vy;if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.y+b.r>H-12&&b.y<H){if(b.x>px&&b.x<px+76){let hit=(b.x-(px+38))/38;b.vx=hit*1.6;b.vy=-Math.abs(b.vy);b.y=H-18}}if(b.y-b.r>H){lose();return}for(let i=0;i<bricks.length;i++){let p=bricks[i];if(!p.on)continue;if(b.x+b.r>p.x&&b.x-b.r<p.x+p.w&&b.y+b.r>p.y&&b.y-b.r<p.y+p.h){p.on=0;score+=10;sc.textContent=score;let cx=b.x-(p.x+p.w/2),cy=b.y-(p.y+p.h/2);if(Math.abs(cx/p.w)>Math.abs(cy/p.h))b.vx*=-1;else b.vy*=-1;break}}if(bricks.every(p=>!p.on))win()}function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#071a2d");g.addColorStop(1,"#02050a");x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<bricks.length;i++){let p=bricks[i];if(!p.on)continue;let colors=["#ff4d4d","#ff9f43","#ffe66d","#4cd964","#42a5f5"];x.fillStyle=colors[p.row];x.fillRect(p.x,p.y,p.w,p.h);x.strokeStyle="#07111d";x.strokeRect(p.x,p.y,p.w,p.h)}x.fillStyle="#ffd23f";x.shadowColor="#ffd23f";x.shadowBlur=8;x.fillRect(px,H-12,76,7);x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fillStyle="#fff";x.fill();x.shadowBlur=0;if(state==="READY"){x.fillStyle="#ffd46a";x.font="bold 12px Arial";x.textAlign="center";x.fillText("TOCA PARA LANZAR",W/2,H/2+35)}}function loop(t){let dt=last?Math.min((t-last)/16.666,2):1;last=t;if(state==="GAME"){for(let i=0;i<dt;i++)update()}draw();requestAnimationFrame(loop)}size();reset();requestAnimationFrame(loop)})()</script></body></html>
