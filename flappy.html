<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Flappy Bird</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(56,189,248,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(250,204,21,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(99,102,241,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}.title-badge{background:linear-gradient(90deg,#facc15,#fb923c);color:#020617;font-size:13px;font-weight:900;letter-spacing:1px;padding:4px 10px;border-radius:8px}.stats-bar{display:flex;gap:6px}.stat-pill{background:rgba(2,6,23,.6);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800;color:#facc15;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:4px}.screen-frame{position:relative;width:100%;aspect-ratio:4/3;min-height:280px;border-radius:14px;border:1px solid rgba(255,255,255,.12);overflow:hidden;background:#38bdf8;box-shadow:inset 0 0 12px rgba(0,0,0,.8),0 4px 10px rgba(0,0,0,.5);cursor:pointer}#gameCanvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;background:rgba(2,6,23,.85);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;z-index:10}.overlay.hidden{display:none}.overlay h2{font-size:24px;font-weight:900;color:#facc15;letter-spacing:1px}.overlay-score-box{background:rgba(15,23,42,.9);border:1px solid rgba(250,204,21,.4);border-radius:12px;padding:10px 20px;text-align:center;min-width:150px}.overlay-score-label{font-size:11px;color:#94a3b8;font-weight:700}.overlay-score-val{font-size:24px;font-weight:900;color:#fff;font-family:'JetBrains Mono',monospace}.controls-area{display:flex;gap:8px;align-items:center;margin-top:4px}.flap-btn{flex:1;height:46px;background:linear-gradient(90deg,#facc15,#f59e0b);border:none;border-radius:12px;color:#020617;font-size:16px;font-weight:900;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(250,204,21,.4);transition:transform .08s}.flap-btn:active{transform:scale(.96)}.sound-toggle{width:44px;height:44px;border-radius:12px;background:rgba(30,41,59,.8);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header"><div class="title-badge">🐥 FLAPPY BIRD</div><div class="stats-bar"><div class="stat-pill">⭐ <span id="scoreText">0</span></div><div class="stat-pill">🏆 <span id="bestText">0</span></div></div></div><div class="screen-frame" id="screenFrame"><canvas id="gameCanvas" width="440" height="330"></canvas><div id="startOverlay" class="overlay"><h2>READY?</h2><div style="font-size:13px;color:#cbd5e1;font-weight:700">TAP SCREEN OR BUTTON TO FLY</div><div style="font-size:36px;animation:bounce .8s infinite alternate">🐥</div></div><div id="overOverlay" class="overlay hidden"><h2>GAME OVER</h2><div class="overlay-score-box"><div class="overlay-score-label">SCORE</div><div class="overlay-score-val" id="finalScore">0</div><div class="overlay-score-label" style="margin-top:6px">BEST</div><div class="overlay-score-val" id="finalBest" style="color:#facc15">0</div><div class="medal-icon" id="medalIcon" style="font-size:24px;margin-top:4px">🥉</div></div><div style="font-size:12px;color:#94a3b8;margin-top:6px">Tap Flap or Screen to Restart</div></div></div><div class="controls-area"><button id="btnFlap" class="flap-btn" type="button"><span>FLAP JUMP</span><span>🐥</span></button><button id="btnSound" class="sound-toggle" type="button">🔊</button></div></div></div><script>(()=>{const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d"),frame=document.getElementById("screenFrame"),scoreEl=document.getElementById("scoreText"),bestEl=document.getElementById("bestText"),startOverlay=document.getElementById("startOverlay"),overOverlay=document.getElementById("overOverlay"),finalScoreEl=document.getElementById("finalScore"),finalBestEl=document.getElementById("finalBest"),medalIconEl=document.getElementById("medalIcon"),btnFlap=document.getElementById("btnFlap"),btnSound=document.getElementById("btnSound");let W=440,H=330,gameState="READY",soundEnabled=true,audioCtx=null;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}function playSound(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==="flap"){osc.type="sine";osc.frequency.setValueAtTime(400,t);osc.frequency.exponentialRampToValueAtTime(800,t+.1);gain.gain.setValueAtTime(.3,t);gain.gain.exponentialRampToValueAtTime(.01,t+.1);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.11)}else if(type==="score"){osc.type="triangle";osc.frequency.setValueAtTime(587.33,t);osc.frequency.setValueAtTime(880,t+.08);gain.gain.setValueAtTime(.4,t);gain.gain.exponentialRampToValueAtTime(.01,t+.25);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.26)}else if(type==="hit"){osc.type="sawtooth";osc.frequency.setValueAtTime(280,t);osc.frequency.exponentialRampToValueAtTime(50,t+.25);gain.gain.setValueAtTime(.5,t);gain.gain.exponentialRampToValueAtTime(.01,t+.26);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.27)}}catch(e){}}btnSound.onclick=()=>{soundEnabled=!soundEnabled;btnSound.textContent=soundEnabled?"🔊":"🔇"};let best=0;try{best=parseInt(localStorage.getItem("flappy_best")||"0",10)}catch(e){}bestEl.textContent=best;let bird={x:80,y:140,radius:14,vy:0,gravity:.28,rotation:0,wingAngle:0},pipes=[],particles=[],score=0,groundOffset=0,clouds=[{x:30,y:30,s:.8},{x:160,y:50,s:1.2},{x:280,y:25,s:.9},{x:390,y:45,s:1.1}];function resize(){const rect=frame.getBoundingClientRect(),bw=Math.round(rect.width||frame.clientWidth||440),bh=Math.round(rect.height||frame.clientHeight||330);if(bw>40&&bh>40){W=bw;H=bh;canvas.width=W;canvas.height=H}else{W=440;H=330;canvas.width=W;canvas.height=H}}function resetGame(){bird.x=W*.25;bird.y=H*.45;bird.vy=0;bird.rotation=0;pipes=[];particles=[];score=0;scoreEl.textContent=0}function spawnPipe(){const gap=100,minTop=30,maxTop=Math.max(minTop+20,H-55-gap-minTop),topHeight=minTop+Math.random()*(maxTop-minTop);pipes.push({x:W+20,width:48,topHeight,bottomY:topHeight+gap,passed:false})}function handleFlap(){initAudio();if(gameState==="READY"){gameState="PLAYING";startOverlay.classList.add("hidden");overOverlay.classList.add("hidden");bird.vy=-5.4;playSound("flap");return}if(gameState==="PLAYING"){bird.vy=-5.4;bird.wingAngle=-.5;playSound("flap");return}if(gameState==="OVER"){resetGame();gameState="PLAYING";startOverlay.classList.add("hidden");overOverlay.classList.add("hidden");bird.vy=-5.4;playSound("flap")}}btnFlap.addEventListener("pointerdown",e=>{e.preventDefault();handleFlap()});frame.addEventListener("pointerdown",e=>{e.preventDefault();handleFlap()});window.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();handleFlap()}});function triggerGameOver(){gameState="OVER";playSound("hit");for(let i=0;i<20;i++)particles.push({x:bird.x,y:bird.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,radius:Math.random()*4+2,color:["#facc15","#f59e0b","#fbbf24","#fff"][Math.floor(Math.random()*4)],alpha:1});if(score>best){best=score;try{localStorage.setItem("flappy_best",best)}catch(e){}bestEl.textContent=best}finalScoreEl.textContent=score;finalBestEl.textContent=best;if(score>=30)medalIconEl.textContent="🥇 PLATINUM";else if(score>=20)medalIconEl.textContent="🥇 GOLD";else if(score>=10)medalIconEl.textContent="🥈 SILVER";else medalIconEl.textContent="🥉 BRONZE";overOverlay.classList.remove("hidden")}let pipeTimer=0;function update(){clouds.forEach(c=>{c.x-=.35*c.s;if(c.x<-60)c.x=W+40});if(gameState==="PLAYING"){bird.vy+=bird.gravity;bird.y+=bird.vy;if(bird.vy<0)bird.rotation=-.3;else bird.rotation=Math.min(Math.PI/2,bird.rotation+.04);const groundY=H-32;if(bird.y+bird.radius>=groundY){bird.y=groundY-bird.radius;triggerGameOver()}if(bird.y-bird.radius<=0){bird.y=bird.radius;bird.vy=0}groundOffset=(groundOffset+2.2)%18;pipeTimer++;if(pipeTimer>85){spawnPipe();pipeTimer=0}for(let i=pipes.length-1;i>=0;i--){const p=pipes[i];p.x-=2.2;if(!p.passed&&p.x+p.width<bird.x){p.passed=true;score++;scoreEl.textContent=score;playSound("score")}const bx=bird.x,by=bird.y,br=bird.radius-2;if(bx+br>p.x&&bx-br<p.x+p.width&&(by-br<p.topHeight||by+br>p.bottomY))triggerGameOver();if(p.x+p.width<-20)pipes.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.alpha-=.025;if(p.alpha<=0)particles.splice(i,1)}}function drawCloud(cx,cy,s){ctx.fillStyle="rgba(255,255,255,.75)";ctx.beginPath();ctx.arc(cx,cy,14*s,0,Math.PI*2);ctx.arc(cx+12*s,cy-6*s,18*s,0,Math.PI*2);ctx.arc(cx+28*s,cy,14*s,0,Math.PI*2);ctx.fill()}function draw(){ctx.clearRect(0,0,W,H);const skyGrad=ctx.createLinearGradient(0,0,0,H);skyGrad.addColorStop(0,"#38bdf8");skyGrad.addColorStop(.7,"#7dd3fc");skyGrad.addColorStop(1,"#bae6fd");ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,H);clouds.forEach(c=>drawCloud(c.x,c.y,c.s));pipes.forEach(p=>{const pipeGrad=ctx.createLinearGradient(p.x,0,p.x+p.width,0);pipeGrad.addColorStop(0,"#22c55e");pipeGrad.addColorStop(.3,"#4ade80");pipeGrad.addColorStop(.8,"#16a34a");pipeGrad.addColorStop(1,"#15803d");ctx.fillStyle=pipeGrad;ctx.fillRect(p.x,0,p.width,p.topHeight);ctx.fillStyle="#15803d";ctx.fillRect(p.x-3,p.topHeight-16,p.width+6,16);ctx.fillStyle=pipeGrad;ctx.fillRect(p.x,p.bottomY,p.width,H-p.bottomY-32);ctx.fillStyle="#15803d";ctx.fillRect(p.x-3,p.bottomY,p.width+6,16)});const groundY=H-32;ctx.fillStyle="#84cc16";ctx.fillRect(0,groundY,W,8);ctx.fillStyle="#d97706";ctx.fillRect(0,groundY+8,W,24);ctx.fillStyle="#b45309";for(let x=-groundOffset;x<W+18;x+=18){ctx.beginPath();ctx.moveTo(x,groundY+8);ctx.lineTo(x+9,groundY+8);ctx.lineTo(x+2,groundY+24);ctx.lineTo(x-7,groundY+24);ctx.fill()}ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rotation);ctx.fillStyle="#facc15";ctx.beginPath();ctx.arc(0,0,bird.radius,0,Math.PI*2);ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle="#ca8a04";ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(6,-4,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#000";ctx.beginPath();ctx.arc(7,-4,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ea580c";ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(18,2);ctx.lineTo(8,6);ctx.closePath();ctx.fill();ctx.fillStyle="#fef08a";ctx.beginPath();ctx.ellipse(-4,2,7,4,bird.wingAngle,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();particles.forEach(p=>{ctx.save();ctx.globalAlpha=Math.max(0,p.alpha);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fill();ctx.restore()})}function loop(){if(!W||!H||W<50||H<50||canvas.width<50)resize();update();draw();requestAnimationFrame(loop)}window.addEventListener("resize",resize);window.addEventListener("orientationchange",()=>{setTimeout(resize,150)});setTimeout(resize,100);setTimeout(resize,300);resize();resetGame();requestAnimationFrame(loop)})();</script></body></html>
