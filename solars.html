<html><body style='margin:0;width:500px;height:500px;overflow:hidden;background:#000;touch-action:none'><canvas id='c' width='500' height='500' style='display:block;width:500px;height:500px;touch-action:none'></canvas><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false}),W=500,H=500,C=250,T=Math.PI*2;let zoom=1,targetZoom=1,camX=0,camY=0,focus=-1,last=0,down=null,moved=0,barDown=0,seed=917331;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296},cl=(v,a,b)=>Math.max(a,Math.min(b,v)),stars=[],dust=[];for(let i=0;i<900;i++)stars.push({x:rnd()*W,y:rnd()*H,r:.2+rnd()*1.1,a:.25+rnd()*.75,p:rnd()*T});for(let i=0;i<320;i++)dust.push({a:rnd()*T,d:112+rnd()*34,r:.2+rnd()*.7,v:.0001+rnd()*.0003});const P=[{n:'Mercurio',d:30,r:3.2,v:.025,t:0},{n:'Venus',d:49,r:5.2,v:.018,t:1},{n:'Tierra',d:70,r:6.3,v:.014,t:2},{n:'Marte',d:93,r:5,v:.011,t:3},{n:'Júpiter',d:130,r:12,v:.006,t:4},{n:'Saturno',d:172,r:10,v:.0045,t:5},{n:'Urano',d:213,r:8,v:.0033,t:6},{n:'Neptuno',d:252,r:8,v:.0027,t:7}];P.forEach(p=>{p.a=rnd()*T;p.rot=rnd()*T});const tex=[];for(let k=0;k<P.length;k++){tex[k]=[];let n=k===2?850:k>3?430:230;for(let i=0;i<n;i++)tex[k].push({a:rnd()*T,d:rnd(),s:rnd(),v:rnd(),w:rnd()})}function pos(p){let d=p.d*zoom;return{x:C+camX+Math.cos(p.a)*d,y:C+camY+Math.sin(p.a)*d*.48}}function raw(p,z){let d=p.d*z;return{x:C+Math.cos(p.a)*d,y:C+Math.sin(p.a)*d*.48}}function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function glow(q,r,col,a){if(r<1)return;let g=x.createRadialGradient(q.x,q.y,0,q.x,q.y,r);g.addColorStop(0,'rgba('+col+','+a+')');g.addColorStop(.45,'rgba('+col+','+(a*.28)+')');g.addColorStop(1,'rgba('+col+',0)');x.fillStyle=g;x.beginPath();x.arc(q.x,q.y,r,0,T);x.fill()}function ball(q,r,a,b){let g=x.createRadialGradient(q.x-r*.4,q.y-r*.5,.1,q.x,q.y,r);g.addColorStop(0,a);g.addColorStop(.3,b);g.addColorStop(.76,'#15181e');g.addColorStop(1,'#000');x.fillStyle=g;x.beginPath();x.arc(q.x,q.y,r,0,T);x.fill()}function background(t){x.fillStyle='#010207';x.fillRect(0,0,W,H);let g=x.createRadialGradient(C+camX,C+camY,1,C+camX,C+camY,430);g.addColorStop(0,'#172353');g.addColorStop(.42,'#070d27');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,W,H);for(const s of stars){let a=s.a*(.65+.35*Math.sin(t*.001+s.p));x.fillStyle='rgba(215,235,255,'+a+')';x.fillRect(s.x,s.y,s.r,s.r)}}function orbits(){if(zoom>9)return;for(const p of P){let d=p.d*zoom;if(d<3)continue;x.beginPath();x.strokeStyle='rgba(100,175,235,.13)';x.lineWidth=.55;x.ellipse(C+camX,C+camY,d,d*.48,0,0,T);x.stroke()}}function belt(){if(zoom>6)return;for(const a of dust){a.a+=a.v;let d=a.d*zoom,q={x:C+camX+Math.cos(a.a)*d,y:C+camY+Math.sin(a.a)*d*.48};x.fillStyle='rgba(180,170,160,.42)';x.fillRect(q.x,q.y,a.r,a.r)}}function sun(t){let q={x:C+camX,y:C+camY};for(let i=0;i<7;i++)glow(q,25+i*8+Math.sin(t*.002+i)*2,'255,115,20',.065);let g=x.createRadialGradient(q.x-7,q.y-8,1,q.x,q.y,22);g.addColorStop(0,'#fff');g.addColorStop(.2,'#fff4a2');g.addColorStop(.55,'#ff9a20');g.addColorStop(1,'#d52d00');x.fillStyle=g;x.beginPath();x.arc(q.x,q.y,22,0,T);x.fill();if(zoom>3){x.save();x.beginPath();x.arc(q.x,q.y,21,0,T);x.clip();for(let i=0;i<60;i++){let a=i*.91+t*.00025,r=4+(i*11)%16;x.fillStyle='rgba(255,245,130,.16)';x.beginPath();x.arc(q.x+Math.cos(a)*r,q.y+Math.sin(a)*r,1+i%3,0,T);x.fill()}x.restore()}}function rocky(i,q,r,lod,t){let base=i===0?'#85847e':i===1?'#b9764e':i===3?'#a5503e':'#777';ball(q,r,'#fff',base);if(lod<3)return;x.save();x.beginPath();x.arc(q.x,q.y,r,0,T);x.clip();let f=tex[i],n=Math.min(f.length,lod*55);for(let j=0;j<n;j++){let u=f[j],a=u.a+P[i].rot+t*.00008,d=u.d*r*.9,px=q.x+Math.cos(a)*d,py=q.y+Math.sin(a)*d*.72,s=.25+u.s*1.35;x.globalAlpha=.12+u.v*.3;x.fillStyle=i===3?(j%4?'#71362e':'#c26b4d'):(j%3?'#494741':'#aaa49b');x.beginPath();x.arc(px,py,s,0,T);x.fill()}x.globalAlpha=1;x.restore()}function earth(q,r,lod,t){ball(q,r,'#fff','#075b9e');x.save();x.beginPath();x.arc(q.x,q.y,r,0,T);x.clip();let f=tex[2],n=Math.min(f.length,lod*80),rot=P[2].rot+t*.00014;for(let i=0;i<n;i++){let u=f[i],a=u.a+rot,d=u.d*r*.94,px=q.x+Math.cos(a)*d,py=q.y+Math.sin(a)*d*.72;if(u.v>.36){let s=r*(.025+u.w*.15);x.fillStyle=u.v>.72?'#a7b76b':'#397846';x.globalAlpha=.35+u.v*.35;x.beginPath();x.ellipse(px,py,s,s*.42,a,0,T);x.fill()}}if(lod>5)for(let i=0;i<90;i++){let u=f[(i*11)%f.length],a=u.a+rot*1.3,d=u.d*r*.97,px=q.x+Math.cos(a)*d,py=q.y+Math.sin(a)*d*.72;x.fillStyle='rgba(245,255,255,.1)';x.beginPath();x.ellipse(px,py,r*.08,r*.025,a,0,T);x.fill()}x.globalAlpha=1;x.restore();glow(q,r*1.25,'80,190,255',.13)}function gas(i,q,r,lod,t){let cs=i===4?['#eee0b8','#ad8062','#f1d49a','#86674f']:i===5?['#e7d5a4','#a28c65','#d9c28d','#806d50']:i===6?['#b7eeee','#4caeb8','#77d2d8','#438d98']:['#a9b9ed','#4263c1','#6887dc','#35489a'];ball(q,r,'#fff',cs[0]);if(lod<2)return;x.save();x.beginPath();x.arc(q.x,q.y,r,0,T);x.clip();let bands=6+Math.min(lod,7);for(let j=0;j<bands;j++){let yy=q.y-r+j*r*2/bands;x.fillStyle=cs[j%cs.length];x.globalAlpha=.2+.07*(j%3);x.fillRect(q.x-r,yy,r*2,r*2/bands*.9)}if(i===4&&lod>3){x.fillStyle='rgba(160,70,45,.55)';x.beginPath();x.ellipse(q.x+r*.25,q.y+r*.2,r*.23,r*.09,-.1,0,T);x.fill()}x.globalAlpha=1;x.restore();glow(q,r*1.18,i===6?'100,230,240':i===7?'90,130,255':'255,210,150',.07)}function rings(q,r){x.save();x.translate(q.x,q.y);x.rotate(-.18);x.scale(1,.34);for(let i=0;i<15;i++){x.beginPath();x.strokeStyle=i===6?'rgba(65,50,38,.8)':'rgba(235,215,175,.35)';x.lineWidth=i===6?2:1;x.arc(0,0,r*(1.3+i*.12),0,T);x.stroke()}x.restore()}function moon(q,r,t){let a=t*.00065,d=r*2.1,m={x:q.x+Math.cos(a)*d,y:q.y+Math.sin(a)*d*.7};ball(m,Math.max(1.4,r*.25),'#eee','#777')}function hit(q){let best=-1,bd=1e9;for(let i=0;i<P.length;i++){let a=pos(P[i]),r=Math.max(10,P[i].r*zoom+8),d=Math.hypot(q.x-a.x,q.y-a.y);if(d<r&&d<bd){bd=d;best=i}}return best}function select(i){focus=i;targetZoom=Math.max(targetZoom,1.7)}function barHit(q){return q.x>145&&q.x<355&&q.y>432&&q.y<465}function barValue(q){let v=cl((q.x-155)/190,0,1);return .35*Math.pow(80/.35,v)}function drawBar(){let y=448,a=155,b=345,r=7;x.save();x.fillStyle='rgba(4,12,24,.78)';x.beginPath();x.roundRect(140,429,220,38,19);x.fill();x.strokeStyle='rgba(115,210,255,.22)';x.lineWidth=1;x.stroke();x.fillStyle='rgba(130,180,205,.25)';x.fillRect(a,y-2,b-a,4);let u=(Math.log(zoom/.35)/Math.log(80/.35)),kx=a+(b-a)*u;x.fillStyle='rgba(100,205,255,.75)';x.fillRect(a,y-2,kx-a,4);x.beginPath();x.arc(kx,y,r,0,T);x.fillStyle='#dff8ff';x.shadowColor='#62d7ff';x.shadowBlur=8;x.fill();x.shadowBlur=0;x.fillStyle='rgba(210,240,255,.72)';x.font='9px Arial';x.textAlign='center';x.fillText(zoom<1?zoom.toFixed(2)+'×':zoom.toFixed(1)+'×',250,440);x.restore()}function drawName(){if(focus<0)return;let p=P[focus];x.save();x.fillStyle='rgba(2,9,18,.72)';x.strokeStyle='rgba(110,210,255,.3)';x.lineWidth=1;x.font='bold 12px Arial';let w=x.measureText(p.n).width+22;x.beginPath();x.roundRect(C-w/2,9,w,25,13);x.fill();x.stroke();x.fillStyle='#e9f8ff';x.textAlign='center';x.fillText(p.n,C,26);x.restore()}function draw(t){x.globalAlpha=1;x.globalCompositeOperation='source-over';background(t);orbits();belt();sun(t);for(let i=0;i<P.length;i++){let p=P[i],q=pos(p),r=p.r*zoom;if(q.x+r<-30||q.x-r>530||q.y+r<-30||q.y-r>530)continue;let lod=zoom<.5?1:zoom<1?2:zoom<2?3:zoom<4?4:zoom<8?5:zoom<16?6:zoom<32?7:8;if(i===2)earth(q,r,lod,t);else if(i<4)rocky(i,q,r,lod,t);else gas(i,q,r,lod,t);if(i===5&&zoom>.7)rings(q,r);if(i===2&&zoom>1)moon(q,r,t);if(i===focus){x.strokeStyle='rgba(100,220,255,.9)';x.lineWidth=1.3;x.beginPath();x.arc(q.x,q.y,r+7+Math.sin(t*.006)*2,0,T);x.stroke()}}drawName();drawBar()}function loop(t){let dt=Math.min(last?(t-last)/16.666:1,2);last=t;for(const p of P){p.a+=p.v*dt;p.rot+=.001*(p.t+1)*dt}zoom+=(targetZoom-zoom)*.12;if(focus>=0){let q=raw(P[focus],zoom);camX=C-q.x;camY=C-q.y}else{camX*=.92;camY*=.92}draw(t);requestAnimationFrame(loop)}c.addEventListener('pointerdown',e=>{e.preventDefault();let q=pt(e);if(barHit(q)){barDown=1;targetZoom=barValue(q);try{c.setPointerCapture(e.pointerId)}catch(_){}return}try{c.setPointerCapture(e.pointerId)}catch(_){}down={id:e.pointerId,x:q.x,y:q.y,lx:q.x,ly:q.y};moved=0});c.addEventListener('pointermove',e=>{let q=pt(e);if(barDown){targetZoom=barValue(q);return}if(!down||down.id!==e.pointerId)return;let dx=q.x-down.lx,dy=q.y-down.ly;if(Math.abs(q.x-down.x)+Math.abs(q.y-down.y)>7)moved=1;if(moved){camX+=dx;camY+=dy;focus=-1}down.lx=q.x;down.ly=q.y});c.addEventListener('pointerup',e=>{let q=pt(e);if(barDown){barDown=0;try{c.releasePointerCapture(e.pointerId)}catch(_){}return}if(!down||down.id!==e.pointerId)return;if(!moved&&Math.hypot(q.x-down.x,q.y-down.y)<9){let h=hit(q);if(h>=0)select(h);else focus=-1}down=null;try{c.releasePointerCapture(e.pointerId)}catch(_){} });c.addEventListener('pointercancel',e=>{barDown=0;down=null});c.addEventListener('dblclick',e=>{let h=hit(pt(e));if(h>=0){select(h);targetZoom=Math.min(80,targetZoom*2)}});addEventListener('keydown',e=>{if(e.key==='+')targetZoom=cl(targetZoom*1.2,.35,80);else if(e.key==='-')targetZoom=cl(targetZoom/1.2,.35,80);else if(e.key==='0'){focus=-1;targetZoom=1;camX=0;camY=0}});requestAnimationFrame(loop)})()</script></body></html>
