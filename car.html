<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Highway Car Racer</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(244,63,94,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(6,182,212,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(139,92,246,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #f43f5e;border-radius:8px;color:#ffe4e6;background:rgba(244,63,94,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.stats{display:flex;gap:6px}.stat{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(2,6,23,.6);padding:4px 6px;text-align:center;font-size:11px;font-weight:700;color:#94a3b8}.stat b{display:block;color:#38bdf8;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800}.reelbox{position:relative;width:100%;aspect-ratio:4/3;min-height:280px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#0b0f19;overflow:hidden;box-shadow:inset 0 2px 10px rgba(0,0,0,.8)}.reelbox canvas{display:block;width:100%;height:100%;touch-action:none}.message{height:26px;display:grid;place-items:center;border:1px solid rgba(56,189,248,.3);border-radius:6px;color:#38bdf8;background:rgba(2,6,23,.6);text-align:center;font:bold 11px 'JetBrains Mono',monospace}.ctrls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px;margin-top:4px}button{height:42px;border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-weight:900;touch-action:none;cursor:pointer;font-size:14px;transition:transform .08s}button:active{transform:scale(.95)}.btn-dir{background:rgba(30,41,59,.9)}.btn-boost{background:linear-gradient(90deg,#f43f5e,#e11d48);border-color:#f43f5e;box-shadow:0 4px 14px rgba(244,63,94,.4)}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:rgba(2,6,23,.9);backdrop-filter:blur(6px)}.over.on{display:grid}.over button{padding:0 24px;height:42px;margin-top:12px;background:#38bdf8;color:#020617;border:none;border-radius:10px;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 14px rgba(56,189,248,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">🏎️ TURBO RACER</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="stats"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">SPEED<b id="spd">75 MPH</b></div><div class="stat">BEST<b id="bs">0</b></div></div><div class="reelbox"><canvas id="gc" width="440" height="330"></canvas></div><div class="message" id="msg">STEER & DODGE TRAFFIC!</div><div class="ctrls"><button id="left" class="btn-dir" type="button">◀ LEFT</button><button id="boost" class="btn-boost" type="button">⚡ BOOST</button><button id="right" class="btn-dir" type="button">RIGHT ▶</button></div><div class="over" id="over"><div><h2 style="font-size:24px;color:#f43f5e;font-weight:900">CRASHED!</h2><div id="fs" style="font-size:16px;font-weight:bold;margin:8px 0;color:#94a3b8"></div><button id="rb" type="button">RACE AGAIN</button></div></div></div></div><script>(()=>{const c=document.getElementById("gc"),x=c.getContext("2d"),box=c.parentElement,btnL=document.getElementById("left"),btnR=document.getElementById("right"),btnB=document.getElementById("boost"),rb=document.getElementById("rb"),over=document.getElementById("over"),msg=document.getElementById("msg"),scEl=document.getElementById("sc"),bsEl=document.getElementById("bs"),spdEl=document.getElementById("spd"),fs=document.getElementById("fs"),sndBtn=document.getElementById("sndBtn");let W=440,H=330,player,enemies=[],coins=[],particles=[],score=0,best=0,alive=false,speed=6,baseSpeed=6,roadOffset=0,roadWidth=320,roadX=60,audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==="coin"){osc.type="sine";osc.frequency.setValueAtTime(880,t);osc.frequency.setValueAtTime(1320,t+.07);gain.gain.setValueAtTime(.25,t);gain.gain.exponentialRampToValueAtTime(.01,t+.22);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.23)}else if(type==="boost"){osc.type="sawtooth";osc.frequency.setValueAtTime(220,t);osc.frequency.exponentialRampToValueAtTime(660,t+.25);gain.gain.setValueAtTime(.2,t);gain.gain.exponentialRampToValueAtTime(.01,t+.26);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.27)}else if(type==="crash"){osc.type="sawtooth";osc.frequency.setValueAtTime(160,t);osc.frequency.exponentialRampToValueAtTime(30,t+.4);gain.gain.setValueAtTime(.5,t);gain.gain.exponentialRampToValueAtTime(.01,t+.42);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.43)}}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?"🔊":"🔇"};try{best=Number(localStorage.getItem("car_best"))||0}catch(e){}bsEl.textContent=best;function size(){const rect=box.getBoundingClientRect(),bw=Math.round(rect.width||box.clientWidth||440),bh=Math.round(rect.height||box.clientHeight||330);if(bw>40&&bh>40){W=bw;H=bh;c.width=W;c.height=H}else{W=440;H=330;c.width=W;c.height=H}roadWidth=Math.min(W*.82,340);roadX=(W-roadWidth)/2}function reset(){size();player={x:W/2,y:H-65,w:28,h:48,vx:0};enemies=[];coins=[];particles=[];score=0;alive=true;speed=baseSpeed;scEl.textContent=0;spdEl.textContent="75 MPH";msg.textContent="DODGE TRAFFIC!";over.classList.remove("on")}function spawnEnemy(){const laneW=roadWidth/3,lane=Math.floor(Math.random()*3),ex=roadX+lane*laneW+laneW/2;enemies.push({x:ex,y:-60,w:28,h:48,speed:Math.random()*2+2.8,color:["#f43f5e","#f59e0b","#10b981","#eab308","#a855f7"][Math.floor(Math.random()*5)]})}function spawnCoin(){const laneW=roadWidth/3,lane=Math.floor(Math.random()*3),cx=roadX+lane*laneW+laneW/2;coins.push({x:cx,y:-35,r:9,collected:false})}function die(){if(!alive)return;alive=false;playTone("crash");best=Math.max(best,score);bsEl.textContent=best;fs.textContent="Final Score: "+score;over.classList.add("on");try{localStorage.setItem("car_best",best)}catch(e){}}let steerLeft=false,steerRight=false,boosting=false;function setupTouch(btn,down,up){btn.addEventListener("pointerdown",e=>{e.preventDefault();initAudio();down()});btn.addEventListener("pointerup",e=>{e.preventDefault();up()});btn.addEventListener("pointercancel",e=>{e.preventDefault();up()})}setupTouch(btnL,()=>steerLeft=true,()=>steerLeft=false);setupTouch(btnR,()=>steerRight=true,()=>steerRight=false);setupTouch(btnB,()=>{boosting=true;speed=baseSpeed*1.9;spdEl.textContent="135 MPH";playTone("boost")},()=>{boosting=false;speed=baseSpeed;spdEl.textContent="75 MPH"});rb.addEventListener("pointerdown",e=>{e.preventDefault();initAudio();reset()});addEventListener("keydown",e=>{initAudio();if(e.code==="ArrowLeft"||e.code==="KeyA")steerLeft=true;if(e.code==="ArrowRight"||e.code==="KeyD")steerRight=true;if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){if(!alive){reset();return}boosting=true;speed=baseSpeed*1.9;spdEl.textContent="135 MPH";playTone("boost")}});addEventListener("keyup",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")steerLeft=false;if(e.code==="ArrowRight"||e.code==="KeyD")steerRight=false;if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){boosting=false;speed=baseSpeed;spdEl.textContent="75 MPH"}});let spawnTimer=0,coinTimer=0;function update(){if(!alive)return;roadOffset=(roadOffset+speed)%40;if(steerLeft)player.x-=5.4;if(steerRight)player.x+=5.4;const minX=roadX+player.w/2+4,maxX=roadX+roadWidth-player.w/2-4;player.x=Math.max(minX,Math.min(maxX,player.x));spawnTimer++;if(spawnTimer>(boosting?35:55)){spawnEnemy();spawnTimer=0}coinTimer++;if(coinTimer>90){spawnCoin();coinTimer=0}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.y+=speed-e.speed;if(Math.abs(player.x-e.x)<(player.w+e.w)*.45&&Math.abs(player.y-e.y)<(player.h+e.h)*.45){die();return}if(e.y>H+60){enemies.splice(i,1);score+=15;scEl.textContent=score}}for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.y+=speed;if(!c.collected&&Math.hypot(player.x-c.x,player.y-c.y)<player.w+c.r){c.collected=true;score+=50;scEl.textContent=score;playTone("coin");for(let p=0;p<8;p++)particles.push({x:c.x,y:c.y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:20,color:"#facc15"})}if(c.y>H+30)coins.splice(i,1)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)}}function drawCar(cx,cy,w,h,color,isPlayer){x.save();x.translate(cx,cy);x.fillStyle=color;x.beginPath();x.roundRect(-w/2,-h/2,w,h,6);x.fill();x.fillStyle="#0f172a";x.beginPath();x.roundRect(-w/2+3,-h/2+8,w-6,14,3);x.fill();x.beginPath();x.roundRect(-w/2+3,h/2-14,w-6,8,2);x.fill();x.fillStyle="#000";[-w/2-2,w/2-2].forEach(tx=>{x.fillRect(tx,-h/2+6,4,10);x.fillRect(tx,h/2-16,4,10)});if(isPlayer){x.fillStyle=boosting?"#00e5ff":"#facc15";x.fillRect(-w/2+3,-h/2+1,4,3);x.fillRect(w/2-7,-h/2+1,4,3);if(boosting){x.fillStyle="rgba(0,229,255,.7)";x.beginPath();x.arc(0,h/2+6,Math.random()*6+4,0,Math.PI*2);x.fill()}}else{x.fillStyle="#f43f5e";x.fillRect(-w/2+3,h/2-3,4,2);x.fillRect(w/2-7,h/2-3,4,2)}x.restore()}function draw(){x.clearRect(0,0,W,H);x.fillStyle="#090d16";x.fillRect(0,0,W,H);x.fillStyle="#1e293b";x.fillRect(roadX,0,roadWidth,H);const curbW=8;for(let y=-roadOffset;y<H+40;y+=20){const cColor=Math.floor((y+roadOffset)/20)%2===0?"#f43f5e":"#fff";x.fillStyle=cColor;x.fillRect(roadX-curbW,y,curbW,20);x.fillRect(roadX+roadWidth,y,curbW,20)}x.strokeStyle="rgba(255,255,255,.6)";x.lineWidth=3;x.setLineDash([16,14]);x.lineDashOffset=-roadOffset;const laneW=roadWidth/3;for(let i=1;i<3;i++){x.beginPath();x.moveTo(roadX+i*laneW,0);x.lineTo(roadX+i*laneW,H);x.stroke()}x.setLineDash([]);coins.forEach(c=>{if(c.collected)return;x.save();x.fillStyle="#facc15";x.shadowColor="#facc15";x.shadowBlur=10;x.beginPath();x.arc(c.x,c.y,c.r,0,Math.PI*2);x.fill();x.fillStyle="#ca8a04";x.beginPath();x.arc(c.x,c.y,c.r*.6,0,Math.PI*2);x.fill();x.restore()});enemies.forEach(e=>drawCar(e.x,e.y,e.w,e.h,e.color,false));if(player)drawCar(player.x,player.y,player.w,player.h,"#06b6d4",true);particles.forEach(p=>{x.fillStyle=p.color;x.fillRect(p.x,p.y,3,3)})}function loop(){if(!W||!H||W<50||H<50||c.width<50)size();update();draw();requestAnimationFrame(loop)}window.addEventListener("resize",size);window.addEventListener("orientationchange",()=>{setTimeout(size,150)});setTimeout(size,100);setTimeout(size,300);size();reset();requestAnimationFrame(loop)})()</script></body></html>
