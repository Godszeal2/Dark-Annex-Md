<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Whack-A-Mole</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(249,115,22,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(234,179,8,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(139,92,246,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #f97316;border-radius:8px;color:#ffedd5;background:rgba(249,115,22,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.stats{display:flex;gap:6px}.stat{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(2,6,23,.6);padding:4px 6px;text-align:center;font-size:11px;font-weight:700;color:#94a3b8}.stat b{display:block;color:#f97316;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:320px;aspect-ratio:1/1;margin:10px auto;padding:12px;background:rgba(2,6,23,.6);border-radius:16px;border:1px solid rgba(255,255,255,.12)}.hole{position:relative;background:#0f172a;border-radius:50%;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;border:3px solid rgba(249,115,22,.3);box-shadow:inset 0 4px 8px rgba(0,0,0,.8)}.mole{font-size:34px;transform:translateY(120%);transition:transform .12s cubic-bezier(.18,.89,.32,1.28);user-select:none}.hole.active .mole{transform:translateY(0)}.hole.hit .mole{transform:translateY(0) scale(.85);filter:grayscale(1)}.reset-btn{width:100%;height:44px;border:none;border-radius:12px;background:linear-gradient(90deg,#f97316,#ea580c);color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(249,115,22,.4)}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:rgba(2,6,23,.9);backdrop-filter:blur(6px)}.over.on{display:grid}.over button{padding:0 24px;height:42px;margin-top:12px;background:#f97316;color:#020617;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(249,115,22,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">🔨 WHACK-A-MOLE</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="stats"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">TIME<b id="tm">30s</b></div><div class="stat">BEST<b id="bs">0</b></div></div><div class="grid" id="grid"></div><button id="rb" class="reset-btn">START / RESTART</button><div class="over" id="over"><div><h2 style="font-size:24px;color:#f97316;font-weight:900">TIME'S UP!</h2><div id="fs" style="font-size:16px;margin:8px 0;color:#94a3b8"></div><button id="rb2">PLAY AGAIN</button></div></div></div></div><script>(()=>{const gridEl=document.getElementById("grid"),scEl=document.getElementById("sc"),tmEl=document.getElementById("tm"),bsEl=document.getElementById("bs"),over=document.getElementById("over"),fs=document.getElementById("fs"),rb=document.getElementById("rb"),rb2=document.getElementById("rb2"),sndBtn=document.getElementById("sndBtn");let holes=[],score=0,timeLeft=30,timer=null,moleTimer=null,activeIdx=-1,best=0;let audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==="whack"){osc.type="triangle";osc.frequency.setValueAtTime(600,t);osc.frequency.exponentialRampToValueAtTime(150,t+.09);gain.gain.setValueAtTime(.3,t);gain.gain.exponentialRampToValueAtTime(.01,t+.1);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.11)}else if(type==="over")[523.25,440,349.23].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sawtooth";o.frequency.setValueAtTime(f,t+i*.08);g.gain.setValueAtTime(.2,t+i*.08);g.gain.exponentialRampToValueAtTime(.01,t+i*.08+.18);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.08);o.stop(t+i*.08+.19)})}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?"🔊":"🔇"};try{best=Number(localStorage.getItem("whack_best"))||0}catch(e){}bsEl.textContent=best;for(let i=0;i<9;i++){const h=document.createElement("div");h.className="hole";const m=document.createElement("div");m.className="mole";m.textContent="🐹";h.appendChild(m);h.onpointerdown=e=>{e.preventDefault();initAudio();if(h.classList.contains("active")&&!h.classList.contains("hit")){h.classList.add("hit");score+=10;scEl.textContent=score;playTone("whack")}};gridEl.appendChild(h);holes.push(h)}function popMole(){holes.forEach(h=>h.className="hole");if(timeLeft<=0)return;activeIdx=Math.floor(Math.random()*holes.length);holes[activeIdx].classList.add("active");moleTimer=setTimeout(popMole,Math.max(450,900-score*5))}function reset(){initAudio();clearInterval(timer);clearTimeout(moleTimer);score=0;timeLeft=30;scEl.textContent=0;tmEl.textContent="30s";over.classList.remove("on");holes.forEach(h=>h.className="hole");popMole();timer=setInterval(()=>{timeLeft--;tmEl.textContent=timeLeft+"s";if(timeLeft<=0){clearInterval(timer);clearTimeout(moleTimer);holes.forEach(h=>h.className="hole");best=Math.max(best,score);bsEl.textContent=best;fs.textContent="Score: "+score;playTone("over");over.classList.add("on");try{localStorage.setItem("whack_best",best)}catch(e){}}},1000)}rb.onclick=reset;rb2.onclick=reset;reset()})()</script></body></html>
