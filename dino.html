<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dino Runner</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(245,158,11,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(16,185,129,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(139,92,246,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #f59e0b;border-radius:8px;color:#fef3c7;background:rgba(245,158,11,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.stats{display:flex;gap:6px}.stat{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(2,6,23,.6);padding:4px 6px;text-align:center;font-size:11px;font-weight:700;color:#94a3b8}.stat b{display:block;color:#f59e0b;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800}.reelbox{position:relative;width:100%;aspect-ratio:4/3;min-height:280px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#0f172a;overflow:hidden;box-shadow:inset 0 2px 10px rgba(0,0,0,.8);cursor:pointer}.reelbox canvas{display:block;width:100%;height:100%;touch-action:none}.btn-jump{width:100%;height:46px;border:none;border-radius:12px;background:linear-gradient(90deg,#f59e0b,#d97706);color:#020617;font-weight:900;font-size:16px;cursor:pointer;transition:transform .08s;box-shadow:0 4px 14px rgba(245,158,11,.4);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}.btn-jump:active{transform:scale(.96)}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:rgba(2,6,23,.9);backdrop-filter:blur(6px)}.over.on{display:grid}.over button{padding:0 24px;height:42px;margin-top:12px;background:#f59e0b;color:#020617;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(245,158,11,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">🦖 DINO RUNNER</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="stats"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">SPEED<b id="spd">1x</b></div><div class="stat">BEST<b id="bs">0</b></div></div><div class="reelbox"><canvas id="gc" width="440" height="330"></canvas></div><button id="btnJ" class="btn-jump">JUMP / TAP (SPACE) 🦖</button><div class="over" id="over"><div><h2 style="font-size:24px;color:#f59e0b;font-weight:900">GAME OVER</h2><div id="fs" style="font-size:16px;margin:8px 0;color:#94a3b8"></div><button id="rb">PLAY AGAIN</button></div></div></div></div><script>(()=>{const c=document.getElementById("gc"),x=c.getContext("2d"),box=c.parentElement,scEl=document.getElementById("sc"),bsEl=document.getElementById("bs"),spdEl=document.getElementById("spd"),over=document.getElementById("over"),fs=document.getElementById("fs"),rb=document.getElementById("rb"),btnJ=document.getElementById("btnJ"),sndBtn=document.getElementById("sndBtn");let W=440,H=330,dino,cacti=[],clouds=[],score=0,best=0,alive=false,speed=5,gravity=.52,groundY=298,audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==="jump"){osc.type="square";osc.frequency.setValueAtTime(150,t);osc.frequency.exponentialRampToValueAtTime(520,t+.12);gain.gain.setValueAtTime(.2,t);gain.gain.exponentialRampToValueAtTime(.01,t+.13);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.14)}else if(type==="score"){osc.type="sine";osc.frequency.setValueAtTime(880,t);osc.frequency.setValueAtTime(1200,t+.08);gain.gain.setValueAtTime(.25,t);gain.gain.exponentialRampToValueAtTime(.01,t+.2);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.21)}else if(type==="hit"){osc.type="sawtooth";osc.frequency.setValueAtTime(220,t);osc.frequency.exponentialRampToValueAtTime(50,t+.3);gain.gain.setValueAtTime(.4,t);gain.gain.exponentialRampToValueAtTime(.01,t+.32);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.33)}}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?"🔊":"🔇"};try{best=Number(localStorage.getItem("dino_best"))||0}catch(e){}bsEl.textContent=best;function size(){const rect=box.getBoundingClientRect(),bw=Math.round(rect.width||box.clientWidth||440),bh=Math.round(rect.height||box.clientHeight||330);if(bw>40&&bh>40){W=bw;H=bh;c.width=W;c.height=H}else{W=440;H=330;c.width=W;c.height=H}groundY=H-32}function reset(){size();dino={x:40,y:groundY-36,w:28,h:36,vy:0,grounded:true,leg:0};cacti=[];clouds=[{x:80,y:40},{x:240,y:60},{x:380,y:30}];score=0;speed=5.2;alive=true;scEl.textContent=0;spdEl.textContent="1x";over.classList.remove("on")}function jump(){initAudio();if(!alive){reset();return}if(dino.grounded){dino.vy=-11.2;dino.grounded=false;playTone("jump")}}btnJ.onpointerdown=e=>{e.preventDefault();jump()};c.onpointerdown=e=>{e.preventDefault();jump()};rb.onpointerdown=e=>{e.preventDefault();initAudio();reset()};addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump()}});let spawnTimer=0,groundOffset=0;function spawnCactus(){const count=Math.random()<.3?2:1;cacti.push({x:W+20,w:18*count,h:32+Math.floor(Math.random()*16),passed:false})}function update(){if(!alive)return;groundOffset=(groundOffset+speed)%20;clouds.forEach(cl=>{cl.x-=speed*.2;if(cl.x<-60)cl.x=W+40});dino.vy+=gravity;dino.y+=dino.vy;if(dino.y>=groundY-dino.h){dino.y=groundY-dino.h;dino.vy=0;dino.grounded=true}dino.leg+=speed*.15;spawnTimer++;if(spawnTimer>Math.max(45,95-Math.floor(speed*3))){spawnCactus();spawnTimer=0}for(let i=cacti.length-1;i>=0;i--){const ct=cacti[i];ct.x-=speed;const cy=groundY-ct.h;if(dino.x+dino.w-4>ct.x&&dino.x+4<ct.x+ct.w&&dino.y+dino.h-4>cy){alive=false;playTone("hit");best=Math.max(best,score);bsEl.textContent=best;fs.textContent="Score: "+score;over.classList.add("on");try{localStorage.setItem("dino_best",best)}catch(e){}return}if(!ct.passed&&ct.x+ct.w<dino.x){ct.passed=true;score+=10;scEl.textContent=score;if(score%100===0){speed=Math.min(13,speed+.6);spdEl.textContent=(speed/5.2).toFixed(1)+"x";playTone("score")}}if(ct.x+ct.w<-20)cacti.splice(i,1)}}function draw(){x.clearRect(0,0,W,H);x.fillStyle="#0f172a";x.fillRect(0,0,W,H);x.fillStyle="rgba(255,255,255,.15)";clouds.forEach(cl=>{x.beginPath();x.arc(cl.x,cl.y,12,0,Math.PI*2);x.arc(cl.x+12,cl.y-4,16,0,Math.PI*2);x.arc(cl.x+24,cl.y,12,0,Math.PI*2);x.fill()});x.strokeStyle="#334155";x.lineWidth=2;x.beginPath();x.moveTo(0,groundY);x.lineTo(W,groundY);x.stroke();x.fillStyle="#475569";for(let gx=-groundOffset;gx<W+20;gx+=15){x.fillRect(gx,groundY+4,4,2);x.fillRect(gx+8,groundY+12,6,2)}cacti.forEach(ct=>{const cy=groundY-ct.h;x.fillStyle="#10b981";x.beginPath();x.roundRect(ct.x,cy,ct.w,ct.h,4);x.fill();x.fillStyle="#059669";x.fillRect(ct.x+3,cy+4,ct.w-6,ct.h-8)});if(dino){x.save();x.fillStyle="#f59e0b";x.beginPath();x.roundRect(dino.x,dino.y,dino.w,dino.h-8,5);x.fill();x.fillRect(dino.x+8,dino.y-6,dino.w-4,14);x.fillStyle="#020617";x.fillRect(dino.x+dino.w-2,dino.y-2,3,3);x.fillStyle="#d97706";const l1=Math.sin(dino.leg)>0?6:0,l2=Math.sin(dino.leg)<=0?6:0;if(dino.grounded){x.fillRect(dino.x+4,dino.y+dino.h-8,4,8-l1);x.fillRect(dino.x+dino.w-8,dino.y+dino.h-8,4,8-l2)}else{x.fillRect(dino.x+4,dino.y+dino.h-8,4,5);x.fillRect(dino.x+dino.w-8,dino.y+dino.h-8,4,7)}x.restore()}}function loop(){if(!W||!H||W<50||H<50||c.width<50)size();update();draw();requestAnimationFrame(loop)}window.addEventListener("resize",size);window.addEventListener("orientationchange",()=>{setTimeout(size,150)});setTimeout(size,100);setTimeout(size,300);size();reset();requestAnimationFrame(loop)})()</script></body></html>
