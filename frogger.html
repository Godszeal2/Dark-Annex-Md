<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Frogger Highway</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(34,197,94,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(6,182,212,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(139,92,246,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #22c55e;border-radius:8px;color:#dcfce7;background:rgba(34,197,94,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.stats{display:flex;gap:6px}.stat{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(2,6,23,.6);padding:4px 6px;text-align:center;font-size:11px;font-weight:700;color:#94a3b8}.stat b{display:block;color:#22c55e;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800}.reelbox{position:relative;width:100%;aspect-ratio:4/3;min-height:280px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#020617;overflow:hidden;box-shadow:inset 0 2px 10px rgba(0,0,0,.8)}.reelbox canvas{display:block;width:100%;height:100%;touch-action:none}.dpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:180px;margin:4px auto 0;touch-action:none}.dpad button{height:40px;border:1px solid rgba(34,197,94,.4);border-radius:10px;background:rgba(34,197,94,.15);color:#dcfce7;font-weight:900;font-size:18px;touch-action:none;cursor:pointer;transition:transform .08s,background .08s}.dpad button:active{transform:scale(.92);background:#22c55e;color:#020617}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:rgba(2,6,23,.9);backdrop-filter:blur(6px)}.over.on{display:grid}.over button{padding:0 24px;height:42px;margin-top:12px;background:#22c55e;color:#020617;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(34,197,94,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">🐸 FROGGER HIGHWAY</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="stats"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">LIVES<b id="lv">3</b></div></div><div class="reelbox"><canvas id="gc" width="440" height="330"></canvas></div><div class="dpad"><div></div><button id="up">▲</button><div></div><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div class="over" id="over"><div><h2 style="font-size:24px;color:#22c55e;font-weight:900">GAME OVER</h2><div id="fs" style="font-size:16px;margin:8px 0;color:#94a3b8"></div><button id="rb">PLAY AGAIN</button></div></div></div></div><script>(()=>{const c=document.getElementById("gc"),x=c.getContext("2d"),box=c.parentElement,scEl=document.getElementById("sc"),lvEl=document.getElementById("lv"),over=document.getElementById("over"),fs=document.getElementById("fs"),rb=document.getElementById("rb"),sndBtn=document.getElementById("sndBtn");const rows=8,cols=10;let W=440,H=330,gridW=44,gridH=41,frog,cars=[],logs=[],score=0,lives=3,alive=false;let audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==='hop'){osc.type='triangle';osc.frequency.setValueAtTime(320,t);osc.frequency.exponentialRampToValueAtTime(560,t+.06);gain.gain.setValueAtTime(.2,t);gain.gain.exponentialRampToValueAtTime(.01,t+.07);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.08)}else if(type==='win'){[523.25,659.25,783.99].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(f,t+i*.06);g.gain.setValueAtTime(.25,t+i*.06);g.gain.exponentialRampToValueAtTime(.01,t+i*.06+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.06);o.stop(t+i*.06+.16)})}else if(type==='die'){osc.type='sawtooth';osc.frequency.setValueAtTime(180,t);osc.frequency.exponentialRampToValueAtTime(40,t+.3);gain.gain.setValueAtTime(.35,t);gain.gain.exponentialRampToValueAtTime(.01,t+.32);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.33)}}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?'🔊':'🔇'};function size(){const rect=box.getBoundingClientRect(),bw=Math.round(rect.width||box.clientWidth||440),bh=Math.round(rect.height||box.clientHeight||330);if(bw>40&&bh>40){W=bw;H=bh;c.width=W;c.height=H}else{W=440;H=330;c.width=W;c.height=H}gridW=W/cols;gridH=H/rows}function resetFrog(){frog={x:Math.floor(cols/2),y:rows-1}}function reset(){size();score=0;lives=3;alive=true;scEl.textContent=0;lvEl.textContent=3;over.classList.remove("on");resetFrog();cars=[{y:rows-2,w:38,speed:2.2,color:'#f43f5e',items:[{x:20},{x:150},{x:280}]},{y:rows-3,w:46,speed:-2.6,color:'#facc15',items:[{x:80},{x:220},{x:360}]},{y:rows-4,w:34,speed:3.2,color:'#06b6d4',items:[{x:40},{x:190},{x:320}]}];logs=[{y:rows-6,w:65,speed:1.8,items:[{x:10},{x:140},{x:270}]},{y:rows-7,w:75,speed:-2,items:[{x:40},{x:190},{x:340}]}]}function hop(dx,dy){if(!alive)return;initAudio();frog.x=Math.max(0,Math.min(cols-1,frog.x+dx));frog.y=Math.max(0,Math.min(rows-1,frog.y+dy));playTone('hop');if(dy<0)score+=10;scEl.textContent=score;if(frog.y===0){score+=100;scEl.textContent=score;playTone('win');resetFrog()}}document.getElementById("up").onpointerdown=e=>{e.preventDefault();hop(0,-1)};document.getElementById("down").onpointerdown=e=>{e.preventDefault();hop(0,1)};document.getElementById("left").onpointerdown=e=>{e.preventDefault();hop(-1,0)};document.getElementById("right").onpointerdown=e=>{e.preventDefault();hop(1,0)};rb.onpointerdown=e=>{e.preventDefault();initAudio();reset()};addEventListener("keydown",e=>{initAudio();if(e.code==="ArrowUp"||e.code==="KeyW")hop(0,-1);if(e.code==="ArrowDown"||e.code==="KeyS")hop(0,1);if(e.code==="ArrowLeft"||e.code==="KeyA")hop(-1,0);if(e.code==="ArrowRight"||e.code==="KeyD")hop(1,0)});function die(){lives--;lvEl.textContent=lives;playTone('die');if(lives<=0){alive=false;fs.textContent="Score: "+score;over.classList.add("on")}else resetFrog()}function update(){if(!alive)return;cars.forEach(lane=>{lane.items.forEach(it=>{it.x+=lane.speed;if(lane.speed>0&&it.x>W+20)it.x=-lane.w-20;if(lane.speed<0&&it.x<-lane.w-20)it.x=W+20;if(frog.y===lane.y){const fx=frog.x*gridW+gridW/2;if(fx>it.x&&fx<it.x+lane.w)die()}})});if(frog.y===rows-6||frog.y===rows-7){let onLog=false;logs.forEach(lane=>{if(frog.y===lane.y)lane.items.forEach(it=>{it.x+=lane.speed;if(lane.speed>0&&it.x>W+20)it.x=-lane.w-20;if(lane.speed<0&&it.x<-lane.w-20)it.x=W+20;const fx=frog.x*gridW+gridW/2;if(fx>it.x&&fx<it.x+lane.w){onLog=true;frog.x+=lane.speed/gridW}})});if(!onLog||frog.x<0||frog.x>=cols)die()}else logs.forEach(lane=>{lane.items.forEach(it=>{it.x+=lane.speed;if(lane.speed>0&&it.x>W+20)it.x=-lane.w-20;if(lane.speed<0&&it.x<-lane.w-20)it.x=W+20})})}function draw(){x.clearRect(0,0,W,H);x.fillStyle="#15803d";x.fillRect(0,0,W,gridH);x.fillStyle="#0284c7";x.fillRect(0,gridH,W,gridH*2);x.fillStyle="#334155";x.fillRect(0,gridH*3,W,gridH);x.fillStyle="#1e293b";x.fillRect(0,gridH*4,W,gridH*3);x.strokeStyle="rgba(255,255,255,.4)";x.lineWidth=2;x.setLineDash([12,12]);x.beginPath();x.moveTo(0,gridH*5);x.lineTo(W,gridH*5);x.stroke();x.beginPath();x.moveTo(0,gridH*6);x.lineTo(W,gridH*6);x.stroke();x.setLineDash([]);x.fillStyle="#15803d";x.fillRect(0,gridH*7,W,gridH);x.fillStyle="#78350f";logs.forEach(lane=>{const ly=lane.y*gridH+4;lane.items.forEach(it=>{x.beginPath();x.roundRect(it.x,ly,lane.w,gridH-8,4);x.fill()})});cars.forEach(lane=>{const cy=lane.y*gridH+6;lane.items.forEach(it=>{x.fillStyle=lane.color;x.beginPath();x.roundRect(it.x,cy,lane.w,gridH-12,5);x.fill();x.fillStyle="#0f172a";x.fillRect(it.x+4,cy+3,lane.w-8,gridH-18)})});if(frog){const fx=frog.x*gridW+gridW/2,fy=frog.y*gridH+gridH/2;x.fillStyle="#4ade80";x.beginPath();x.arc(fx,fy,Math.min(gridW,gridH)*.38,0,Math.PI*2);x.fill();x.fillStyle="#020617";x.beginPath();x.arc(fx-5,fy-4,3,0,Math.PI*2);x.arc(fx+5,fy-4,3,0,Math.PI*2);x.fill()}}function loop(){if(!W||!H||W<50||H<50||c.width<50)size();update();draw();requestAnimationFrame(loop)}window.addEventListener('resize',size);window.addEventListener('orientationchange',()=>{setTimeout(size,150)});setTimeout(size,100);setTimeout(size,300);size();reset();requestAnimationFrame(loop)})()</script></body></html>
