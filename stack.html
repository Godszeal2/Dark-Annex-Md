<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stack</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#080d12;color:#edf2f5;font-family:Arial,sans-serif}body{min-height:100vh;padding:12px;display:flex;justify-content:center}.wrap{width:min(680px,100%)}.card{background:#101820;border:1px solid #26343d;border-radius:18px;padding:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:22px;font-weight:900;color:#ffb52e}.sub{font-size:11px;color:#71808b;margin-top:3px}.sound{width:40px;height:40px;border:1px solid #34434d;background:#17222a;color:#fff;border-radius:11px;font-size:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.stat{background:#0b1116;border:1px solid #202c34;border-radius:10px;padding:8px;text-align:center}.stat b{display:block;font-size:18px;color:#ffb52e}.stat span{font-size:9px;color:#65747f}.game{position:relative;height:min(620px,72vh);min-height:430px;overflow:hidden;border:1px solid #263740;border-radius:15px;background:linear-gradient(#101d2a,#172b3b 55%,#111b22);touch-action:manipulation;user-select:none}.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#ffffff99 1px,transparent 1px),radial-gradient(circle,#ffffff55 1px,transparent 1px);background-size:83px 79px,137px 121px;background-position:12px 20px,41px 62px;opacity:.35}.glow{position:absolute;left:50%;top:35%;width:280px;height:280px;transform:translate(-50%,-50%);background:radial-gradient(circle,#315b70aa,transparent 68%)}.tower{position:absolute;left:0;right:0;bottom:0;height:100%;transition:bottom .25s}.base{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:150px;height:28px;border-radius:8px 8px 2px 2px;background:#293943;border:1px solid #465761}.block{position:absolute;height:32px;border-radius:5px;border:2px solid #ffd071;background:#ff9f2e;box-shadow:0 4px 10px #0008}.moving{z-index:5;background:#42b9dc;border-color:#9beaff}.ghost{z-index:2;border-style:dashed;background:transparent;opacity:.45;box-shadow:none}.perfect{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-size:24px;font-weight:900;color:#ffd35b;opacity:0;pointer-events:none;text-shadow:0 3px 12px #000;z-index:10}.pop{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;opacity:0;pointer-events:none;z-index:10}.hint{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);font-size:11px;color:#71808b;white-space:nowrap;z-index:8}.pause{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:10px;border:1px solid #34434d;background:#0b1116cc;color:#fff;font-weight:900;z-index:15}.overlay{position:absolute;inset:0;background:#05090dcc;display:flex;align-items:center;justify-content:center;z-index:30}.overlay.hide{display:none}.panel{width:84%;background:#101820;border:1px solid #34434d;border-radius:16px;padding:24px;text-align:center}.panel h2{margin:0 0 8px;color:#ffb52e}.panel p{color:#aab5bc;font-size:13px;line-height:1.5}.btn{width:100%;height:46px;border:0;border-radius:11px;background:#bd761b;color:#fff;font-weight:900}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.ctrl{height:46px;border-radius:11px;border:1px solid #35444d;background:#17222a;color:#fff;font-weight:800}.ctrl.main{background:#b96f18;border-color:#dd922d}.popAnim{animation:pop .65s ease-out}.perfectAnim{animation:perfect .8s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-35px)}}@keyframes perfect{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}25%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-30px) scale(1.1)}}@media(max-width:420px){.game{min-height:400px;height:68vh}.hint{font-size:10px}}</style></head><body><div class="wrap"><div class="card"><div class="head"><div><div class="title">🧱 STACK</div><div class="sub">Build higher. Don't miss.</div></div><button class="sound" id="sound" type="button">🔊</button></div><div class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="height">0</b><span>HEIGHT</span></div><div class="stat"><b id="best">0</b><span>BEST</span></div></div><div class="game" id="game"><div class="stars"></div><div class="glow"></div><button class="pause" id="pause" type="button">Ⅱ</button><div class="tower" id="tower"><div class="base"></div><div class="block moving" id="moving"></div><div class="block ghost" id="ghost"></div></div><div class="perfect" id="perfect">PERFECT!</div><div class="pop" id="pop">+1</div><div class="hint" id="hint">Toca para colocar el bloque</div><div class="overlay" id="overlay"><div class="panel"><h2 id="panelTitle">🧱 STACK</h2><p id="panelText">Coloca los bloques uno sobre otro y construye la torre más alta.</p><button class="btn" id="start" type="button">COMENZAR</button></div></div></div><div class="controls"><button class="ctrl main" id="drop" type="button">COLOCAR BLOQUE</button><button class="ctrl" id="restart" type="button">REINICIAR</button></div></div></div><script>(function(){var game=document.getElementById("game"),tower=document.getElementById("tower"),moving=document.getElementById("moving"),ghost=document.getElementById("ghost"),overlay=document.getElementById("overlay"),start=document.getElementById("start"),drop=document.getElementById("drop"),restart=document.getElementById("restart"),pause=document.getElementById("pause"),sound=document.getElementById("sound"),scoreEl=document.getElementById("score"),heightEl=document.getElementById("height"),bestEl=document.getElementById("best"),hint=document.getElementById("hint"),perfect=document.getElementById("perfect"),pop=document.getElementById("pop"),panelTitle=document.getElementById("panelTitle"),panelText=document.getElementById("panelText");var running=false,paused=false,score=0,height=0,best=0,x=50,dir=1,speed=1.8,width=170,blocks=[],raf=0,soundOn=true,audio=null;function tone(f,d){if(!soundOn)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.value=.035;o.start();o.stop(audio.currentTime+(d||.07))}catch(e){}}function place(el,w,xp,bottom,color){el.style.width=w+"px";el.style.left="calc("+xp+"% - "+(w/2)+"px)";el.style.bottom=bottom+"px";if(color){el.style.background=color}}function animate(){if(!running||paused)return;x+=dir*speed;if(x>=88){x=88;dir=-1}if(x<=12){x=12;dir=1}moving.style.left="calc("+x+"% - "+(width/2)+"px)";raf=requestAnimationFrame(animate)}function startGame(){cancelAnimationFrame(raf);running=true;paused=false;score=0;height=0;x=50;dir=1;speed=1.8;width=170;blocks=[];tower.style.bottom="0px";scoreEl.textContent="0";heightEl.textContent="0";pause.textContent="Ⅱ";hint.textContent="Toca para colocar el bloque";overlay.classList.add("hide");moving.style.display="block";ghost.style.display="block";place(moving,width,50,62);place(ghost,width,50,62);tone(500,.08);raf=requestAnimationFrame(animate)}function gameOver(){running=false;cancelAnimationFrame(raf);tone(130,.25);if(score>best){best=score;bestEl.textContent=best}panelTitle.textContent="💥 GAME OVER";panelText.innerHTML="Altura: <b>"+height+"</b><br>Puntuación: <b>"+score+"</b><br>Récord: <b>"+best+"</b>";start.textContent="JUGAR DE NUEVO";overlay.classList.remove("hide")}function placeBlock(){if(!running||paused)return;var prev=blocks.length?blocks[blocks.length-1]:{x:50,w:170,bottom:28};var gameWidth=game.clientWidth;var delta=(x-prev.x)/100*gameWidth;var overlap=prev.w-Math.abs(delta);if(overlap<9){gameOver();return}var perfectHit=Math.abs(delta)<4;var newW=perfectHit?prev.w:overlap;var newX=perfectHit?prev.x:prev.x+(x>prev.x?overlap/2:-overlap/2)/gameWidth*100;newX=Math.max(newW/gameWidth*50,Math.min(100-newW/gameWidth*50,newX));var bottom=28+(height+1)*34;var color=perfectHit?"#ffd34d":height%5===4?"#b877ff":"#ff9f2e";var b=document.createElement("div");b.className="block";b.style.width=newW+"px";b.style.left="calc("+newX+"% - "+newW/2+"px)";b.style.bottom=bottom+"px";b.style.background=color;tower.appendChild(b);blocks.push({x:newX,w:newW,bottom:bottom});height++;score+=perfectHit?2:1;width=newW;x=newX;speed=Math.min(6,1.8+height*.14);scoreEl.textContent=score;heightEl.textContent=height;place(moving,width,x,bottom+34,"#42b9dc");place(ghost,width,x,bottom+34);pop.textContent=perfectHit?"+2":"+"+(perfectHit?2:1);pop.classList.remove("popAnim");void pop.offsetWidth;pop.classList.add("popAnim");if(perfectHit){perfect.classList.remove("perfectAnim");void perfect.offsetWidth;perfect.classList.add("perfectAnim");tone(900,.12)}else tone(480+Math.min(height,25)*12,.06);if(newW<25)hint.textContent="¡Bloque muy pequeño!";else hint.textContent="Toca para colocar el bloque";if(height>6)tower.style.bottom=-Math.min(180,(height-6)*34)+"px";if(height>=15)game.style.background="linear-gradient(#21182d,#302041 55%,#161a22)";if(height>=30)game.style.background="linear-gradient(#351b29,#47243b 55%,#17171e)";if(height>=45)game.style.background="linear-gradient(#10151d,#26344c 55%,#111820)"}function togglePause(){if(!running)return;paused=!paused;pause.textContent=paused?"▶":"Ⅱ";hint.textContent=paused?"PAUSA":"Toca para colocar el bloque";if(!paused)raf=requestAnimationFrame(animate)}function reset(){blocks.forEach(function(b){if(b.el&&b.el.parentNode)b.el.parentNode.removeChild(b.el)});while(tower.children.length>3)tower.removeChild(tower.lastChild);tower.style.bottom="0";moving.style.display="block";ghost.style.display="block";startGame()}game.addEventListener("pointerdown",function(e){if(e.target===pause)return;if(!running){startGame();return}placeBlock()});drop.addEventListener("click",placeBlock);start.addEventListener("click",startGame);restart.addEventListener("click",reset);pause.addEventListener("click",togglePause);sound.addEventListener("click",function(){soundOn=!soundOn;sound.textContent=soundOn?"🔊":"🔇"});document.addEventListener("keydown",function(e){if(e.code==="Space"){e.preventDefault();placeBlock()}if(e.code==="Escape")togglePause()});bestEl.textContent="0";overlay.classList.remove("hide");place(moving,width,50,62);place(ghost,width,50,62)})();</script></body></html>
