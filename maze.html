<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Maze Runner</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{width:100%;min-height:100%;background:#070b16;color:#f8fafc;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}.ambient-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 15% 15%,rgba(6,182,212,.2) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(139,92,246,.18) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(16,185,129,.1) 0%,transparent 60%);pointer-events:none;z-index:0}.container{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:14px 12px 24px}.game-card{background:rgba(15,23,42,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}.header-bar{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{padding:4px 10px;border:1px solid #06b6d4;border-radius:8px;color:#cffafe;background:rgba(6,182,212,.15);font:900 14px 'Outfit',sans-serif;letter-spacing:1px}.sound-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(30,41,59,.8);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}.stats{display:flex;gap:6px}.stat{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(2,6,23,.6);padding:4px 6px;text-align:center;font-size:11px;font-weight:700;color:#94a3b8}.stat b{display:block;color:#06b6d4;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800}.reelbox{position:relative;width:100%;aspect-ratio:4/3;min-height:280px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#020617;overflow:hidden;box-shadow:inset 0 2px 10px rgba(0,0,0,.8)}.reelbox canvas{display:block;width:100%;height:100%;touch-action:none}.dpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:180px;margin:4px auto 0;touch-action:none}.dpad button{height:40px;border:1px solid rgba(6,182,212,.4);border-radius:10px;background:rgba(6,182,212,.15);color:#cffafe;font-weight:900;font-size:18px;touch-action:none;cursor:pointer;transition:transform .08s,background .08s}.dpad button:active{transform:scale(.92);background:#06b6d4;color:#020617}.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:rgba(2,6,23,.9);backdrop-filter:blur(6px)}.over.on{display:grid}.over button{padding:0 24px;height:42px;margin-top:12px;background:#06b6d4;color:#020617;border:none;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(6,182,212,.4)}</style></head><body><div class="ambient-glow"></div><div class="container"><div class="game-card"><div class="header-bar"><div class="title">🌀 MAZE RUNNER</div><button id="sndBtn" class="sound-btn" type="button">🔊</button></div><div class="stats"><div class="stat">LEVEL<b id="lv">1</b></div><div class="stat">MOVES<b id="mv">0</b></div></div><div class="reelbox"><canvas id="gc" width="440" height="330"></canvas></div><div class="dpad"><div></div><button id="up">▲</button><div></div><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div class="over" id="over"><div><h2 style="font-size:24px;color:#06b6d4;font-weight:900">MAZE ESCAPED!</h2><div id="fs" style="font-size:16px;margin:8px 0;color:#94a3b8"></div><button id="rb">NEXT LEVEL</button></div></div></div></div><script>(()=>{const c=document.getElementById("gc"),x=c.getContext("2d"),box=c.parentElement,lvEl=document.getElementById("lv"),mvEl=document.getElementById("mv"),over=document.getElementById("over"),fs=document.getElementById("fs"),rb=document.getElementById("rb"),sndBtn=document.getElementById("sndBtn");let W=440,H=330,cols=15,rows=11,cw=29,ch=30,grid=[],player={r:1,c:1},goal={r:rows-2,c:cols-2},level=1,moves=0;let audioCtx=null,soundEnabled=true;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function playTone(type){if(!soundEnabled)return;try{initAudio();const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==='step'){osc.type='sine';osc.frequency.setValueAtTime(360,t);gain.gain.setValueAtTime(.12,t);gain.gain.exponentialRampToValueAtTime(.01,t+.04);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.05)}else if(type==='win'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t+i*.06);g.gain.setValueAtTime(.25,t+i*.06);g.gain.exponentialRampToValueAtTime(.01,t+i*.06+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.06);o.stop(t+i*.06+.17)})}}catch(e){}}sndBtn.onclick=()=>{soundEnabled=!soundEnabled;sndBtn.textContent=soundEnabled?'🔊':'🔇'};function size(){const rect=box.getBoundingClientRect(),bw=Math.round(rect.width||box.clientWidth||440),bh=Math.round(rect.height||box.clientHeight||330);if(bw>40&&bh>40){W=bw;H=bh;c.width=W;c.height=H}else{W=440;H=330;c.width=W;c.height=H}cw=W/cols;ch=H/rows}function generateMaze(){grid=Array.from({length:rows},()=>Array(cols).fill(1));function carve(r,c){grid[r][c]=0;const dirs=[[-2,0],[2,0],[0,-2],[0,2]].sort(()=>Math.random()-.5);for(const[dr,dc]of dirs){const nr=r+dr,nc=c+dc;if(nr>0&&nr<rows-1&&nc>0&&nc<cols-1&&grid[nr][nc]===1){grid[r+dr/2][c+dc/2]=0;carve(nr,nc)}}}carve(1,1);player={r:1,c:1};goal={r:rows-2,c:cols-2};grid[goal.r][goal.c]=0}function reset(){size();moves=0;mvEl.textContent=0;lvEl.textContent=level;over.classList.remove("on");generateMaze();draw()}function move(dr,dc){initAudio();const nr=player.r+dr,nc=player.c+dc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&grid[nr][nc]===0){player.r=nr;player.c=nc;moves++;mvEl.textContent=moves;playTone('step');draw();if(player.r===goal.r&&player.c===goal.c){playTone('win');fs.textContent="Escaped in "+moves+" moves!";level++;over.classList.add("on")}}}document.getElementById("up").onpointerdown=e=>{e.preventDefault();move(-1,0)};document.getElementById("down").onpointerdown=e=>{e.preventDefault();move(1,0)};document.getElementById("left").onpointerdown=e=>{e.preventDefault();move(0,-1)};document.getElementById("right").onpointerdown=e=>{e.preventDefault();move(0,1)};rb.onpointerdown=e=>{e.preventDefault();initAudio();reset()};addEventListener("keydown",e=>{initAudio();if(e.code==="ArrowUp"||e.code==="KeyW")move(-1,0);if(e.code==="ArrowDown"||e.code==="KeyS")move(1,0);if(e.code==="ArrowLeft"||e.code==="KeyA")move(0,-1);if(e.code==="ArrowRight"||e.code==="KeyD")move(0,1)});function draw(){if(!W||!H||W<50||H<50||c.width<50)size();x.clearRect(0,0,W,H);x.fillStyle="#030712";x.fillRect(0,0,W,H);x.fillStyle="#1e293b";for(let r=0;r<rows;r++)for(let cl=0;cl<cols;cl++)if(grid[r][cl]===1)x.fillRect(cl*cw,r*ch,cw+.5,ch+.5);const gx=goal.c*cw+cw/2,gy=goal.r*ch+ch/2;x.save();x.fillStyle="#10b981";x.shadowColor="#10b981";x.shadowBlur=12;x.beginPath();x.arc(gx,gy,Math.min(cw,ch)*.38,0,Math.PI*2);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(gx,gy,Math.min(cw,ch)*.16,0,Math.PI*2);x.fill();x.restore();const px=player.c*cw+cw/2,py=player.r*ch+ch/2;x.save();x.fillStyle="#06b6d4";x.shadowColor="#06b6d4";x.shadowBlur=12;x.beginPath();x.arc(px,py,Math.min(cw,ch)*.38,0,Math.PI*2);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(px,py,Math.min(cw,ch)*.18,0,Math.PI*2);x.fill();x.restore()}window.addEventListener('resize',()=>{size();draw()});window.addEventListener('orientationchange',()=>{setTimeout(()=>{size();draw()},150)});setTimeout(()=>{size();draw()},100);setTimeout(()=>{size();draw()},300);reset()})()</script></body></html>
